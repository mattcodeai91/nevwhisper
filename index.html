<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NevWhisper — NEV369 Memo Chat</title>

  <style>
    :root {
      --bg: #070b14;
      --panel: #0d1322;
      --panel-2: #111a2c;
      --border: #24304a;
      --text: #edf3ff;
      --muted: #8e9bb3;
      --accent: #8b7cff;
      --accent-2: #5ee7c4;
      --danger: #ff6b7a;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1;
      letter-spacing: -1.5px;
    }

    .brand p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      text-align: right;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .status strong {
      color: var(--accent-2);
    }

    .panel {
      background: linear-gradient(
        180deg,
        rgba(17, 26, 44, 0.96),
        rgba(13, 19, 34, 0.96)
      );
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .controls {
      padding: 18px;
      margin-bottom: 18px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        background 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    button.danger {
      border-color: rgba(255, 107, 122, 0.45);
      color: #ff9aa5;
    }

    .search {
      width: 100%;
      border: 1px solid var(--border);
      background: #090f1c;
      color: var(--text);
      padding: 13px 15px;
      border-radius: 11px;
      outline: none;
      font-size: 14px;
    }

    .search:focus {
      border-color: var(--accent);
    }

    .progress-wrap {
      margin-top: 15px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    .progress {
      width: 100%;
      height: 8px;
      border-radius: 99px;
      background: #080d18;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(
        90deg,
        var(--accent),
        var(--accent-2)
      );
      transition: width 0.25s ease;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .stat {
      background: rgba(9, 15, 28, 0.75);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 18px;
      font-weight: 800;
    }

    .feed {
      padding: 18px;
    }

    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .feed-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .feed-count {
      color: var(--muted);
      font-size: 13px;
    }

    .empty {
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    .whisper {
      padding: 16px;
      border: 1px solid var(--border);
      background: rgba(8, 13, 24, 0.72);
      border-radius: 14px;
      margin-bottom: 10px;
    }

    .whisper:last-child {
      margin-bottom: 0;
    }

    .whisper-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 9px;
    }

    .block {
      color: var(--accent-2);
      font-weight: 800;
      font-size: 13px;
    }

    .time {
      color: var(--muted);
      font-size: 12px;
    }

    .memo {
      font-size: 17px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 11px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      padding: 5px 8px;
      border-radius: 7px;
      background: #111a2b;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tx-link {
      color: var(--accent);
      text-decoration: none;
    }

    .tx-link:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 20px 0 5px;
    }

    @media (max-width: 760px) {
      body {
        padding: 14px;
      }

      .header {
        flex-direction: column;
      }

      .status {
        text-align: left;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <h1>NevWhisper</h1>
      <p>NEV369 Memo Chat · public on-chain whispers</p>
    </div>

    <div class="status">
      <div id="connectionStatus">Connecting…</div>
      <div id="lastUpdated">Not updated yet</div>
    </div>
  </header>


  <section class="panel controls">

    <div class="toolbar">
      <button
        id="refreshBtn"
        class="primary"
        type="button"
      >
        Refresh Now
      </button>

      <button
        id="rescanBtn"
        class="danger"
        type="button"
      >
        Rebuild Chain Index
      </button>
    </div>

    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="Search whispers, transaction hashes, addresses, or block numbers…"
      autocomplete="off"
    >

    <div class="progress-wrap">

      <div class="progress-top">
        <span id="scanStatus">
          Starting scanner…
        </span>

        <span id="scanPercent">
          0%
        </span>
      </div>

      <div class="progress">
        <div
          id="progressBar"
          class="progress-bar"
        ></div>
      </div>

    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-label">
          Chain height
        </div>

        <div
          id="chainHeight"
          class="stat-value"
        >
          —
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Verified blocks
        </div>

        <div
          id="verifiedCount"
          class="stat-value"
        >
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Whispers
        </div>

        <div
          id="whisperCount"
          class="stat-value"
        >
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Repair queue
        </div>

        <div
          id="repairCount"
          class="stat-value"
        >
          0
        </div>
      </div>

    </div>

  </section>


  <section class="panel feed">

    <div class="feed-header">
      <h2>Whispers</h2>

      <div
        id="feedCount"
        class="feed-count"
      >
        0 whispers
      </div>
    </div>

    <div id="feed"></div>

  </section>


  <div class="footer">
    NevWhisper reads public NEV369 transaction memos directly from the chain.
  </div>

</div>


<script>
"use strict";

/*
 * ============================================================
 * NevWhisper NEV369 scanner
 * ============================================================
 *
 * Scan order:
 *
 *   1. New blocks
 *   2. Historical repair
 *   3. Save verified state
 *   4. Repeat
 *
 * Important:
 *
 * A block is VERIFIED when the block was successfully retrieved
 * and examined.
 *
 * A block does NOT need to contain a memo to be verified.
 *
 * Whispers are separately indexed by transaction hash.
 *
 * ============================================================
 */


/* ------------------------------------------------------------
   CONFIG
------------------------------------------------------------ */

const NODE =
  "https://nevwhisper-proxy.mattcodeai91.workers.dev";

const EXPLORER =
  "https://q-lock-ecosystem.com/explorer/#/tx/";

const AUTO_REFRESH_MS =
  369000;


/*
 * The Worker safely handles 10 upstream block requests
 * per invocation.
 */
const BATCH_SIZE = 10;


/*
 * We can run several Worker requests at once.
 *
 * Each Worker invocation still only scans 10 blocks,
 * so Cloudflare's per-invocation subrequest limit is respected.
 */
const REPAIR_CONCURRENCY = 3;


/*
 * New blocks are more important than repair blocks.
 */
const NEW_BLOCK_BATCHES = 3;


/* ------------------------------------------------------------
   STORAGE
------------------------------------------------------------ */

const MEMO_STORAGE =
  "nevwhisper.memo.cache.v4";

const VERIFIED_STORAGE =
  "nevwhisper.verified.blocks.v4";

const REBUILD_STORAGE =
  "nevwhisper.clean.rebuild.v1";


/*
 * We intentionally use NEW storage keys.
 *
 * The previous cache contained the bad situation where the
 * #5745 memo appeared against #0.
 *
 * This version therefore starts a clean memo index.
 */
let whispers = [];

let verifiedHeights =
  new Set();

let chainHeight =
  null;

let scanning =
  false;


/* ------------------------------------------------------------
   DOM
------------------------------------------------------------ */

const $ =
  id => document.getElementById(id);

const connectionStatus =
  $("connectionStatus");

const lastUpdated =
  $("lastUpdated");

const scanStatus =
  $("scanStatus");

const scanPercent =
  $("scanPercent");

const progressBar =
  $("progressBar");

const chainHeightEl =
  $("chainHeight");

const verifiedCountEl =
  $("verifiedCount");

const whisperCountEl =
  $("whisperCount");

const repairCountEl =
  $("repairCount");

const feedCount =
  $("feedCount");

const feed =
  $("feed");

const searchInput =
  $("searchInput");

const refreshBtn =
  $("refreshBtn");

const rescanBtn =
  $("rescanBtn");


/* ------------------------------------------------------------
   UTILITY
------------------------------------------------------------ */

function sleep(ms) {
  return new Promise(
    resolve => setTimeout(resolve, ms)
  );
}


function numberOrNull(value) {
  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : null;
}


function nowTime() {
  return new Date()
    .toLocaleTimeString();
}


function setStatus(text) {
  scanStatus.textContent =
    text;
}


function setProgress(percent) {

  const safe =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent) || 0
      )
    );

  progressBar.style.width =
    safe + "%";

  scanPercent.textContent =
    Math.round(safe) + "%";
}


function setConnected(text) {
  connectionStatus.innerHTML =
    "<strong>" +
    escapeHtml(text) +
    "</strong>";
}


function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ------------------------------------------------------------
   STORAGE
------------------------------------------------------------ */

function saveWhispers() {

  try {

    localStorage.setItem(
      MEMO_STORAGE,
      JSON.stringify(whispers)
    );

  } catch (error) {

    console.warn(
      "Could not save whispers:",
      error
    );
  }
}


function loadWhispers() {

  try {

    const raw =
      localStorage.getItem(
        MEMO_STORAGE
      );

    if (!raw) {
      whispers = [];
      return;
    }

    const parsed =
      JSON.parse(raw);

    if (Array.isArray(parsed)) {

      whispers =
        parsed.filter(
          item =>
            item &&
            typeof item === "object" &&
            typeof item.tx_hash === "string" &&
            item.tx_hash.trim() !== ""
        );

    } else {

      whispers = [];
    }

  } catch {

    whispers = [];
  }
}


function saveVerified() {

  try {

    const values =
      Array.from(
        verifiedHeights
      )
      .filter(
        n => Number.isInteger(n)
      )
      .sort(
        (a, b) => a - b
      );

    localStorage.setItem(
      VERIFIED_STORAGE,
      JSON.stringify(values)
    );

  } catch (error) {

    console.warn(
      "Could not save verified blocks:",
      error
    );
  }
}


function loadVerified() {

  try {

    const raw =
      localStorage.getItem(
        VERIFIED_STORAGE
      );

    if (!raw) {
      verifiedHeights = new Set();
      return;
    }

    const parsed =
      JSON.parse(raw);

    if (Array.isArray(parsed)) {

      verifiedHeights =
        new Set(
          parsed
            .map(Number)
            .filter(
              Number.isInteger
            )
        );

    } else {

      verifiedHeights =
        new Set();
    }

  } catch {

    verifiedHeights =
      new Set();
  }
}


/*
 * One-time cleanup of the old bad caches.
 *
 * We don't touch the old keys during normal operation.
 *
 * This ensures the old incorrect #0/#5745 association
 * cannot survive into the new index.
 */
function cleanLegacyStateOnce() {

  try {

    const alreadyDone =
      localStorage.getItem(
        REBUILD_STORAGE
      );

    if (alreadyDone === "yes") {
      return;
    }

    localStorage.removeItem(
      "nevwhisper.memo.cache.v2"
    );

    localStorage.removeItem(
      "nevwhisper.scan.state.v2"
    );

    localStorage.removeItem(
      "nevwhisper.scan.state.v3"
    );

    localStorage.removeItem(
      "nevwhisper.memo.cache.v3"
    );

    localStorage.removeItem(
      "nevwhisper.verified.blocks.v3"
    );

    /*
     * Start the new verified index clean.
     *
     * This is important because old verification state may
     * have been produced by the buggy scanner.
     */
    localStorage.removeItem(
      VERIFIED_STORAGE
    );

    localStorage.setItem(
      REBUILD_STORAGE,
      "yes"
    );

  } catch (error) {

    console.warn(
      "Legacy cleanup warning:",
      error
    );
  }
}


/* ------------------------------------------------------------
   API
------------------------------------------------------------ */

async function getJson(
  path
) {

  const response =
    await fetch(
      NODE + path,
      {
        method: "GET",
        cache: "no-store",
        headers: {
          "Accept":
            "application/json"
        }
      }
    );

  const text =
    await response.text();

  let data;

  try {

    data =
      JSON.parse(text);

  } catch {

    throw new Error(
      "Invalid JSON response"
    );
  }

  if (!response.ok) {

    throw new Error(
      String(
        data?.error ||
        response.statusText ||
        response.status
      )
    );
  }

  return data;
}


async function getInfo() {

  return await getJson(
    "/info"
  );
}


/* ------------------------------------------------------------
   MEMO EXTRACTION
------------------------------------------------------------ */

function extractMemos(
  block,
  requestedHeight
) {

  if (!block) {
    return [];
  }

  /*
   * IMPORTANT:
   *
   * Never use requestedHeight as the displayed memo block
   * when the node has supplied a real block height.
   */
  const actualBlock =
    numberOrNull(
      block.index ??
      block.height
    );

  const blockHeight =
    actualBlock !== null
      ? actualBlock
      : requestedHeight;

  const transactions =
    Array.isArray(
      block.transactions
    )
      ? block.transactions
      : [];

  const found = [];

  for (
    const tx of transactions
  ) {

    if (
      !tx ||
      typeof tx !== "object"
    ) {
      continue;
    }

    const memo =
      typeof tx.payload_memo === "string"
        ? tx.payload_memo.trim()
        : "";

    if (!memo) {
      continue;
    }

    const txHash =
      String(
        tx.hash ??
        tx.tx_hash ??
        ""
      ).trim();

    /*
     * A memo without a transaction hash is not safe to
     * index because we cannot reliably deduplicate it.
     */
    if (!txHash) {
      continue;
    }

    found.push({

      block:
        blockHeight,

      timestamp:
        tx.timestamp ??
        block.timestamp ??
        null,

      tx_hash:
        txHash,

      sender:
        String(
          tx.sender ??
          ""
        ),

      recipient:
        String(
          tx.recipient ??
          ""
        ),

      amount:
        tx.amount ??
        0,

      fee:
        tx.fee ??
        0,

      memo

    });
  }

  return found;
}


/* ------------------------------------------------------------
   DEDUPLICATION
------------------------------------------------------------ */

function mergeWhispers(
  incoming
) {

  let changed = false;

  const byHash =
    new Map();

  /*
   * Existing whispers first.
   */
  for (
    const item of whispers
  ) {

    if (
      item &&
      typeof item.tx_hash === "string" &&
      item.tx_hash.trim() !== ""
    ) {

      byHash.set(
        item.tx_hash,
        item
      );
    }
  }

  /*
   * Incoming blockchain data wins.
   *
   * This is important because the new scanner has the
   * authoritative actual block number.
   */
  for (
    const item of incoming
  ) {

    if (
      !item ||
      !item.tx_hash
    ) {
      continue;
    }

    const previous =
      byHash.get(
        item.tx_hash
      );

    if (
      !previous ||
      previous.block !== item.block ||
      previous.memo !== item.memo
    ) {

      byHash.set(
        item.tx_hash,
        item
      );

      changed = true;
    }
  }

  whispers =
    Array.from(
      byHash.values()
    );

  whispers.sort(
    (a, b) => {

      if (
        Number(b.block) !==
        Number(a.block)
      ) {

        return (
          Number(b.block) -
          Number(a.block)
        );
      }

      return String(
        b.tx_hash
      ).localeCompare(
        String(a.tx_hash)
      );
    }
  );

  if (changed) {
    saveWhispers();
  }
}


/* ------------------------------------------------------------
   EXACT VERIFICATION
------------------------------------------------------------ */

/*
 * The Worker response contains:
 *
 *   from
 *   to
 *   scanned
 *   next
 *   whispers
 *   errors
 *
 * We NEVER mark a block verified simply because it was
 * requested.
 *
 * Every requested height is marked verified ONLY when it did
 * not appear in the Worker error list.
 */
function markBatchVerified(
  from,
  to,
  errors
) {

  const failed =
    new Set(
      Array.isArray(errors)
        ? errors
            .map(
              item =>
                numberOrNull(
                  item?.height
                )
            )
            .filter(
              n => n !== null
            )
        : []
    );

  for (
    let h = from;
    h >= to;
    h--
  ) {

    if (!failed.has(h)) {

      verifiedHeights.add(
        h
      );
    }
  }

  saveVerified();

  return failed;
}


/* ------------------------------------------------------------
   SCAN ONE BATCH
------------------------------------------------------------ */

async function scanBatch(
  from,
  to
) {

  const result =
    await getJson(
      "/whispers?from=" +
      encodeURIComponent(from) +
      "&to=" +
      encodeURIComponent(to)
    );

  const actualFrom =
    numberOrNull(
      result.from
    );

  const actualTo =
    numberOrNull(
      result.to
    );

  /*
   * Use the range we explicitly asked the Worker to scan.
   *
   * The Worker is sequential and returns errors for individual
   * failed heights.
   */
  const batchFrom =
    actualFrom !== null
      ? actualFrom
      : from;

  const batchTo =
    actualTo !== null
      ? actualTo
      : to;

  const errors =
    Array.isArray(result.errors)
      ? result.errors
      : [];

  /*
   * Merge the actual memo records returned by the node.
   */
  mergeWhispers(
    Array.isArray(
      result.whispers
    )
      ? result.whispers
      : []
  );

  /*
   * Mark successful blocks verified.
   */
  const failed =
    markBatchVerified(
      batchFrom,
      batchTo,
      errors
    );

  return {

    result,

    from:
      batchFrom,

    to:
      batchTo,

    failed,

    errors,

    whispers:
      Array.isArray(
        result.whispers
      )
        ? result.whispers
        : []

  };
}


/* ------------------------------------------------------------
   NEW BLOCK SCAN
------------------------------------------------------------ */

async function scanNewBlocks(
  currentHeight
) {

  if (
    currentHeight === null ||
    currentHeight < 0
  ) {
    return;
  }

  /*
   * Find the highest block we have actually verified.
   */
  const verifiedArray =
    Array.from(
      verifiedHeights
    )
    .filter(
      n =>
        Number.isInteger(n) &&
        n >= 0
    )
    .sort(
      (a, b) => b - a
    );

  const highestVerified =
    verifiedArray.length
      ? verifiedArray[0]
      : -1;

  /*
   * Nothing new.
   */
  if (
    currentHeight <=
    highestVerified
  ) {

    return;
  }

  const totalNew =
    currentHeight -
    highestVerified;

  let cursor =
    currentHeight;

  let completed =
    0;

  setStatus(
    "Checking new blocks first · #" +
    currentHeight
  );

  while (
    cursor >
    highestVerified
  ) {

    const batchFrom =
      cursor;

    const batchTo =
      Math.max(
        highestVerified + 1,
        cursor -
        BATCH_SIZE +
        1
      );

    try {

      const result =
        await scanBatch(
          batchFrom,
          batchTo
        );

      completed +=
        batchFrom -
        batchTo +
        1;

      cursor =
        batchTo - 1;

      const percent =
        Math.min(
          100,
          Math.round(
            (
              completed /
              totalNew
            ) * 100
          )
        );

      setStatus(
        "Checking new blocks · #" +
        batchFrom
      );

      setProgress(
        percent
      );

    } catch (error) {

      console.warn(
        "New block scan failed:",
        batchFrom,
        batchTo,
        error
      );

      /*
       * Do not mark anything verified.
       *
       * Leave cursor in place so the next refresh can retry.
       */
      break;
    }
  }
}


/* ------------------------------------------------------------
   REPAIR QUEUE
------------------------------------------------------------ */

/*
 * Find the first unverified block.
 */
function findFirstUnverified(
  maxHeight
) {

  for (
    let h = 0;
    h <= maxHeight;
    h++
  ) {

    if (
      !verifiedHeights.has(h)
    ) {
      return h;
    }
  }

  return null;
}


/*
 * Find a contiguous unverified batch beginning at start.
 *
 * We only put truly unverified blocks into the request.
 */
function getRepairBatch(
  start,
  maxHeight
) {

  const heights = [];

  for (
    let h = start;
    h <= maxHeight &&
    heights.length < BATCH_SIZE;
    h++
  ) {

    if (
      !verifiedHeights.has(h)
    ) {

      heights.push(h);

    } else {

      /*
       * Stop at the first verified block so that we don't
       * accidentally scan unnecessary blocks.
       */
      break;
    }
  }

  if (!heights.length) {
    return null;
  }

  /*
   * Worker scans descending:
   *
   * from = highest
   * to   = lowest
   */
  return {

    from:
      Math.max(...heights),

    to:
      Math.min(...heights)

  };
}


/* ------------------------------------------------------------
   FAST HISTORICAL REPAIR
------------------------------------------------------------ */

async function repairHistorical(
  currentHeight
) {

  if (
    currentHeight === null ||
    currentHeight < 0
  ) {
    return;
  }

  let first =
    findFirstUnverified(
      currentHeight
    );

  if (first === null) {

    setStatus(
      "Full chain verified · Genesis → #" +
      currentHeight
    );

    setProgress(
      100
    );

    return;
  }

  /*
   * Repair from the oldest missing block upward.
   *
   * We process up to three batches concurrently.
   */
  while (first !== null) {

    const jobs = [];

    let cursor =
      first;

    for (
      let i = 0;
      i < REPAIR_CONCURRENCY;
      i++
    ) {

      const batch =
        getRepairBatch(
          cursor,
          currentHeight
        );

      if (!batch) {
        break;
      }

      jobs.push(
        batch
      );

      cursor =
        batch.from + 1;

      /*
       * Find the next unverified area after this batch.
       */
      while (
        cursor <= currentHeight &&
        verifiedHeights.has(cursor)
      ) {
        cursor++;
      }
    }

    if (!jobs.length) {
      break;
    }

    const promises =
      jobs.map(
        async batch => {

          try {

            return {
              batch,
              result:
                await scanBatch(
                  batch.from,
                  batch.to
                )
            };

          } catch (error) {

            return {
              batch,
              error
            };
          }
        }
      );

    const results =
      await Promise.all(
        promises
      );

    let successful =
      0;

    for (
      const item of results
    ) {

      if (item.error) {

        console.warn(
          "Repair batch failed:",
          item.batch,
          item.error
        );

        continue;
      }

      successful +=
        item.result.from -
        item.result.to +
        1;
    }

    /*
     * Calculate how much of the chain is verified.
     */
    const verified =
      verifiedHeights.size;

    const total =
      currentHeight + 1;

    const percent =
      Math.min(
        100,
        Math.round(
          (
            verified /
            total
          ) * 100
        )
      );

    setProgress(
      percent
    );

    setStatus(
      "Repairing historical blocks · #" +
      first +
      " · " +
      percent +
      "%"
    );

    updateStats();

    /*
     * If absolutely nothing succeeded, don't hammer the node.
     */
    if (
      successful === 0
    ) {

      await sleep(
        1500
      );
    }

    first =
      findFirstUnverified(
        currentHeight
      );
  }

  if (
    findFirstUnverified(
      currentHeight
    ) === null
  ) {

    setProgress(
      100
    );

    setStatus(
      "Full chain verified · Genesis → #" +
      currentHeight
    );
  }
}


/* ------------------------------------------------------------
   MAIN SCAN
------------------------------------------------------------ */

async function runScan(
  forceRebuild = false
) {

  if (scanning) {
    return;
  }

  scanning = true;

  refreshBtn.disabled =
    true;

  rescanBtn.disabled =
    true;

  try {

    /*
     * Manual rebuild:
     *
     * Completely rebuild the local index.
     */
    if (forceRebuild) {

      localStorage.removeItem(
        MEMO_STORAGE
      );

      localStorage.removeItem(
        VERIFIED_STORAGE
      );

      loadWhispers();
      loadVerified();

      setStatus(
        "Starting clean chain rebuild…"
      );

      setProgress(
        0
      );
    }

    const info =
      await getInfo();

    chainHeight =
      numberOrNull(
        info.height ??
        info.chain_height
      );

    if (
      chainHeight === null
    ) {

      throw new Error(
        "Could not determine chain height."
      );
    }

    chainHeightEl.textContent =
      "#" + chainHeight;

    setConnected(
      "Connected · NEV369"
    );

    /*
     * ========================================================
     * STEP 1 — NEW BLOCKS FIRST
     * ========================================================
     */

    setStatus(
      "Checking new blocks first…"
    );

    await scanNewBlocks(
      chainHeight
    );

    updateStats();
    renderFeed();


    /*
     * ========================================================
     * STEP 2 — HISTORICAL REPAIR
     * ========================================================
     */

    const remainingBeforeRepair =
      findFirstUnverified(
        chainHeight
      );

    if (
      remainingBeforeRepair !== null
    ) {

      await repairHistorical(
        chainHeight
      );

    } else {

      setProgress(
        100
      );

      setStatus(
        "Full chain verified · Genesis → #" +
        chainHeight
      );
    }


    /*
     * ========================================================
     * STEP 3 — FINAL NEW-BLOCK CHECK
     *
     * The chain may have advanced while historical repair was
     * running.
     * ========================================================
     */

    const latestInfo =
      await getInfo();

    const latestHeight =
      numberOrNull(
        latestInfo.height ??
        latestInfo.chain_height
      );

    if (
      latestHeight !== null &&
      latestHeight >
      chainHeight
    ) {

      chainHeight =
        latestHeight;

      chainHeightEl.textContent =
        "#" + chainHeight;

      setStatus(
        "Catching up newest blocks · #" +
        chainHeight
      );

      await scanNewBlocks(
        latestHeight
      );
    }


    updateStats();
    renderFeed();

    lastUpdated.textContent =
      "Updated " +
      nowTime();

    if (
      findFirstUnverified(
        chainHeight
      ) === null
    ) {

      setStatus(
        "Full chain verified · Genesis → #" +
        chainHeight
      );

      setProgress(
        100
      );

    } else {

      const remaining =
        countUnverified(
          chainHeight
        );

      setStatus(
        "Connected · " +
        remaining +
        " blocks remain to verify"
      );
    }

  } catch (error) {

    console.error(
      "NevWhisper scan error:",
      error
    );

    setConnected(
      "Connection error"
    );

    setStatus(
      "Scanner error · " +
      String(error.message || error)
    );

  } finally {

    scanning =
      false;

    refreshBtn.disabled =
      false;

    rescanBtn.disabled =
      false;

    updateStats();
    renderFeed();
  }
}


/* ------------------------------------------------------------
   COUNTS
------------------------------------------------------------ */

function countUnverified(
  maxHeight
) {

  let count = 0;

  for (
    let h = 0;
    h <= maxHeight;
    h++
  ) {

    if (
      !verifiedHeights.has(h)
    ) {
      count++;
    }
  }

  return count;
}


/* ------------------------------------------------------------
   UI STATS
------------------------------------------------------------ */

function updateStats() {

  verifiedCountEl.textContent =
    verifiedHeights.size
      .toLocaleString();

  whisperCountEl.textContent =
    whispers.length
      .toLocaleString();

  const remaining =
    chainHeight === null
      ? 0
      : countUnverified(
          chainHeight
        );

  repairCountEl.textContent =
    remaining.toLocaleString();

  feedCount.textContent =
    whispers.length === 1
      ? "1 whisper"
      : whispers.length +
        " whispers";
}


/* ------------------------------------------------------------
   SEARCH
------------------------------------------------------------ */

function matchesSearch(
  item,
  query
) {

  if (!query) {
    return true;
  }

  const haystack =
    [
      item.memo,
      item.tx_hash,
      item.sender,
      item.recipient,
      item.block,
      item.amount,
      item.fee
    ]
    .join(" ")
    .toLowerCase();

  return haystack.includes(
    query.toLowerCase()
  );
}


/* ------------------------------------------------------------
   RENDER FEED
------------------------------------------------------------ */

function renderFeed() {

  const query =
    searchInput.value.trim();

  const visible =
    whispers.filter(
      item =>
        matchesSearch(
          item,
          query
        )
    );

  if (!visible.length) {

    feed.innerHTML = `
      <div class="empty">
        ${
          whispers.length
            ? "No whispers match your search."
            : "No public whispers have been indexed yet."
        }
      </div>
    `;

    return;
  }

  feed.innerHTML =
    visible
      .map(
        item => {

          const timestamp =
            item.timestamp
              ? new Date(
                  item.timestamp
                ).toLocaleString()
              : "Unknown time";

          const block =
            numberOrNull(
              item.block
            );

          const blockText =
            block !== null
              ? "#" + block
              : "Unknown block";

          const txHash =
            String(
              item.tx_hash
            );

          const shortenedTx =
            txHash.length > 24
              ? txHash.slice(0, 12) +
                "…" +
                txHash.slice(-10)
              : txHash;

          const sender =
            String(
              item.sender || ""
            );

          const recipient =
            String(
              item.recipient || ""
            );

          return `
            <article class="whisper">

              <div class="whisper-top">

                <div class="block">
                  ${escapeHtml(blockText)}
                </div>

                <div class="time">
                  ${escapeHtml(timestamp)}
                </div>

              </div>

              <div class="memo">
                ${escapeHtml(item.memo)}
              </div>

              <div class="meta">

                <span class="tag">
                  TX
                  <a
                    class="tx-link"
                    href="${EXPLORER}${encodeURIComponent(txHash)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    style="margin-left:5px"
                  >
                    ${escapeHtml(shortenedTx)}
                  </a>
                </span>

                ${
                  sender
                    ? `
                      <span
                        class="tag"
                        title="${escapeHtml(sender)}"
                      >
                        From:
                        ${escapeHtml(
                          shortenAddress(sender)
                        )}
                      </span>
                    `
                    : ""
                }

                ${
                  recipient
                    ? `
                      <span
                        class="tag"
                        title="${escapeHtml(recipient)}"
                      >
                        To:
                        ${escapeHtml(
                          shortenAddress(recipient)
                        )}
                      </span>
                    `
                    : ""
                }

                ${
                  item.amount !== undefined
                    ? `
                      <span class="tag">
                        Amount:
                        ${escapeHtml(
                          formatAmount(
                            item.amount
                          )
                        )}
                      </span>
                    `
                    : ""
                }

              </div>

            </article>
          `;
        }
      )
      .join("");
}


/* ------------------------------------------------------------
   DISPLAY HELPERS
------------------------------------------------------------ */

function shortenAddress(
  value
) {

  const text =
    String(value || "");

  if (
    text.length <= 22
  ) {
    return text;
  }

  return (
    text.slice(0, 10) +
    "…" +
    text.slice(-8)
  );
}


function formatAmount(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "0";
  }

  const numeric =
    Number(value);

  if (
    Number.isFinite(numeric)
  ) {

    /*
     * NEV369 uses 8 decimals.
     */
    if (
      Number.isInteger(numeric) &&
      numeric > 100000
    ) {

      return (
        numeric / 100000000
      ).toLocaleString(
        undefined,
        {
          maximumFractionDigits: 8
        }
      ) + " NEV";
    }

    return (
      numeric.toLocaleString()
    );
  }

  return String(value);
}


/* ------------------------------------------------------------
   BUTTONS
------------------------------------------------------------ */

refreshBtn.addEventListener(
  "click",
  async () => {

    await runScan(
      false
    );
  }
);


rescanBtn.addEventListener(
  "click",
  async () => {

    const confirmed =
      window.confirm(
        "Rebuild the NevWhisper chain index from Genesis?\n\n" +
        "This clears the local memo index and verified-block " +
        "state, then scans the chain again.\n\n" +
        "This does not change anything on the NEV369 blockchain."
      );

    if (!confirmed) {
      return;
    }

    await runScan(
      true
    );
  }
);


searchInput.addEventListener(
  "input",
  () => {

    renderFeed();

  }
);


/* ------------------------------------------------------------
   STARTUP
------------------------------------------------------------ */

async function start() {

  /*
   * Remove the old corrupted cache once.
   */
  cleanLegacyStateOnce();

  /*
   * Load the NEW clean index.
   */
  loadWhispers();
  loadVerified();

  updateStats();
  renderFeed();

  /*
   * First scan:
   *
   * NEW BLOCKS FIRST
   * then
   * HISTORICAL REPAIR
   */
  await runScan(
    false
  );

}


/* ------------------------------------------------------------
   AUTOMATIC REFRESH
------------------------------------------------------------ */

setInterval(
  async () => {

    if (!scanning) {

      await runScan(
        false
      );

    }

  },
  AUTO_REFRESH_MS
);


/* ------------------------------------------------------------
   GO
------------------------------------------------------------ */

start();

</script>
