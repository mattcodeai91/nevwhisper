<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NevWhisper — NEV369 Memo Chat</title>

  <style>
    :root {
      --bg: #0b0f14;
      --panel: #111720;
      --panel-2: #151d28;
      --border: #263241;
      --text: #eef3f8;
      --muted: #8d9aaa;
      --accent: #7dd3fc;
      --accent-2: #38bdf8;
      --success: #86efac;
      --warning: #fcd34d;
      --danger: #fca5a5;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .wrap {
      width: min(1100px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    header {
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: white;
      font-weight: 900;
      font-size: 18px;
      box-shadow: 0 8px 22px rgba(14, 165, 233, 0.22);
    }

    h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.1;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 15px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.1s ease;
    }

    button:hover:not(:disabled) {
      background: #1b2633;
      border-color: #3a4b60;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button.primary {
      background: #075985;
      border-color: #0ea5e9;
    }

    button.primary:hover:not(:disabled) {
      background: #0369a1;
    }

    button.danger {
      border-color: #7f1d1d;
      color: #fecaca;
    }

    button.danger:hover:not(:disabled) {
      background: #2a1417;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 17px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .status-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 12px;
    }

    .status-text {
      font-weight: 700;
      font-size: 14px;
    }

    .status-detail {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .status-pill {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: #17212c;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .status-pill.running {
      color: var(--accent);
      border-color: #075985;
      background: #082f49;
    }

    .status-pill.current {
      color: var(--success);
      border-color: #166534;
      background: #052e16;
    }

    .status-pill.error {
      color: var(--danger);
      border-color: #7f1d1d;
      background: #2a0d0d;
    }

    .progress-track {
      height: 8px;
      background: #080c11;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #1b2531;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(
        90deg,
        var(--accent-2),
        #818cf8
      );
      transition: width 0.25s ease;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 19px;
      font-weight: 800;
    }

    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 0 12px;
    }

    .feed-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .search {
      width: 260px;
      max-width: 100%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 9px;
      padding: 9px 11px;
      outline: none;
      font-size: 13px;
    }

    .search:focus {
      border-color: var(--accent-2);
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /*
      Compact whisper card
    */

    .whisper {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.16);
    }

    .whisper:hover {
      border-color: #344457;
    }

    .whisper-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .block {
      color: var(--accent);
      font-weight: 900;
      font-size: 14px;
      white-space: nowrap;
    }

    .time {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      white-space: nowrap;
    }

    .memo {
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      font-weight: 600;
      overflow-wrap: anywhere;
      margin-bottom: 12px;
    }

    .details {
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr);
      row-gap: 7px;
      column-gap: 10px;
      font-size: 12px;
    }

    .detail-label {
      color: var(--muted);
      font-weight: 700;
    }

    .detail-value {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .amount {
      color: var(--success);
      font-weight: 800;
    }

    .hash-link,
    .address-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 100%;
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
      font-size: 11px;
    }

    .short {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
    }

    .external {
      font-family: inherit;
      font-size: 11px;
      opacity: 0.7;
      flex: 0 0 auto;
    }

    .empty {
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .footer {
      margin-top: 28px;
      color: #687586;
      font-size: 11px;
      text-align: center;
    }

    .error-box {
      margin-top: 10px;
      padding: 9px 11px;
      border-radius: 8px;
      background: #250d0d;
      border: 1px solid #6f1d1d;
      color: #fecaca;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .feed-header {
        align-items: stretch;
        flex-direction: column;
      }

      .search {
        width: 100%;
      }
    }

    @media (max-width: 560px) {
      .wrap {
        width: min(100% - 18px, 1100px);
        padding-top: 18px;
      }

      h1 {
        font-size: 21px;
      }

      .whisper {
        padding: 12px;
      }

      .whisper-head {
        align-items: flex-start;
      }

      .time {
        white-space: normal;
      }

      .details {
        grid-template-columns: 72px minmax(0, 1fr);
      }

      .controls button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <header>
      <div class="brand">
        <div class="logo">NW</div>

        <div>
          <h1>NevWhisper</h1>
          <div class="subtitle">
            NEV369 Memo Chat — public on-chain whispers
          </div>
        </div>
      </div>
    </header>

    <section class="controls">
      <button
        id="startBtn"
        class="primary"
        onclick="startScan()"
      >
        Start Scan
      </button>

      <button
        id="stopBtn"
        class="danger"
        onclick="stopScan()"
        disabled
      >
        Stop Scan
      </button>

      <button
        id="rebuildBtn"
        onclick="rebuildFromGenesis()"
      >
        Rebuild From Genesis
      </button>
    </section>

    <section class="status-panel">

      <div class="status-top">

        <div>
          <div
            id="statusText"
            class="status-text"
          >
            Ready
          </div>

          <div
            id="statusDetail"
            class="status-detail"
          >
            Press Start Scan to verify the NEV369 chain from Genesis.
          </div>
        </div>

        <div
          id="statusPill"
          class="status-pill"
        >
          IDLE
        </div>

      </div>

      <div class="progress-track">
        <div
          id="progressBar"
          class="progress-bar"
        ></div>
      </div>

      <div
        id="errorBox"
        class="error-box"
        style="display:none"
      ></div>

    </section>

    <section class="stats">

      <div class="stat">
        <div class="stat-label">
          Chain Height
        </div>

        <div
          id="chainHeight"
          class="stat-value"
        >
          —
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Verified Through
        </div>

        <div
          id="verifiedThrough"
          class="stat-value"
        >
          —
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Whispers
        </div>

        <div
          id="whisperCount"
          class="stat-value"
        >
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          Blocks Remaining
        </div>

        <div
          id="blocksRemaining"
          class="stat-value"
        >
          —
        </div>
      </div>

    </section>

    <section class="feed-header">

      <h2>
        Whispers
      </h2>

      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Search whispers..."
        autocomplete="off"
      >

    </section>

    <section
      id="feed"
      class="feed"
    >
      <div class="empty">
        No whispers loaded yet.
      </div>
    </section>

    <div class="footer">
      NEV369 · Genesis-to-tip verification · Public memo explorer
    </div>

  </main>

  <script>
    /*
      ============================================================
      NEVWHISPER
      Genesis → current chain scanner
      Compact public whisper display
      ============================================================
    */

    const NODE =
      "https://nevwhisper-proxy.mattcodeai91.workers.dev";

    const DB_NAME =
      "nevwhisper-genesis-v1";

    const DB_VERSION = 1;

    const BATCH_SIZE = 10;

    const TIP_CHECK_INTERVAL = 100;

    const MAX_RETRIES = 4;

    const RETRY_DELAY = 1500;

    const AUTO_REFRESH_MS = 369000;


    /*
      ============================================================
      STATE
      ============================================================
    */

    const state = {

      verifiedThrough: -1,

      chainHeight: -1,

      whispers: new Map(),

      scanning: false,

      stopRequested: false,

      blocksSinceTipCheck: 0

    };


    let db = null;


    /*
      ============================================================
      INDEXED DB
      ============================================================
    */

    function openDatabase() {

      return new Promise((resolve, reject) => {

        const request =
          indexedDB.open(
            DB_NAME,
            DB_VERSION
          );

        request.onupgradeneeded = event => {

          const database =
            event.target.result;

          if (
            !database.objectStoreNames.contains("meta")
          ) {

            database.createObjectStore(
              "meta"
            );
          }

          if (
            !database.objectStoreNames.contains("whispers")
          ) {

            database.createObjectStore(
              "whispers",
              {
                keyPath: "tx_hash"
              }
            );

          }

        };

        request.onsuccess = event => {

          db = event.target.result;

          resolve(db);

        };

        request.onerror = () => {

          reject(
            request.error ||
            new Error(
              "Could not open IndexedDB"
            )
          );

        };

      });

    }


    function dbGet(storeName, key) {

      return new Promise((resolve, reject) => {

        const tx =
          db.transaction(
            storeName,
            "readonly"
          );

        const store =
          tx.objectStore(storeName);

        const request =
          store.get(key);

        request.onsuccess = () =>
          resolve(request.result);

        request.onerror = () =>
          reject(request.error);

      });

    }


    function dbPut(storeName, value, key) {

      return new Promise((resolve, reject) => {

        const tx =
          db.transaction(
            storeName,
            "readwrite"
          );

        const store =
          tx.objectStore(storeName);

        const request =
          key === undefined
            ? store.put(value)
            : store.put(value, key);

        request.onsuccess = () =>
          resolve();

        request.onerror = () =>
          reject(request.error);

      });

    }


    function dbClear(storeName) {

      return new Promise((resolve, reject) => {

        const tx =
          db.transaction(
            storeName,
            "readwrite"
          );

        const request =
          tx.objectStore(storeName).clear();

        request.onsuccess = () =>
          resolve();

        request.onerror = () =>
          reject(request.error);

      });

    }


    async function saveState() {

      await dbPut(
        "meta",
        state.verifiedThrough,
        "verifiedThrough"
      );

      await dbPut(
        "meta",
        state.chainHeight,
        "chainHeight"
      );

    }


    async function loadState() {

      const verified =
        await dbGet(
          "meta",
          "verifiedThrough"
        );

      const chainHeight =
        await dbGet(
          "meta",
          "chainHeight"
        );

      if (
        typeof verified === "number"
      ) {

        state.verifiedThrough =
          verified;

      }

      if (
        typeof chainHeight === "number"
      ) {

        state.chainHeight =
          chainHeight;

      }

    }


    async function loadWhispers() {

      return new Promise((resolve, reject) => {

        const tx =
          db.transaction(
            "whispers",
            "readonly"
          );

        const store =
          tx.objectStore("whispers");

        const request =
          store.openCursor();

        request.onsuccess = event => {

          const cursor =
            event.target.result;

          if (!cursor) {

            resolve();

            return;

          }

          const item =
            cursor.value;

          if (
            item &&
            item.tx_hash
          ) {

            state.whispers.set(
              item.tx_hash,
              item
            );

          }

          cursor.continue();

        };

        request.onerror = () =>
          reject(request.error);

      });

    }


    /*
      ============================================================
      NETWORK
      ============================================================
    */

    async function getJson(
      path,
      attempt = 0
    ) {

      const url =
        NODE.replace(/\/$/, "") +
        path;

      try {

        const response =
          await fetch(
            url,
            {
              method: "GET",
              headers: {
                "Accept":
                  "application/json"
              },
              cache: "no-store"
            }
          );

        const text =
          await response.text();

        let data;

        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            "Invalid JSON response"
          );

        }

        if (!response.ok) {

          throw new Error(
            `${response.status}: ${
              data.error ||
              data.details ||
              response.statusText
            }`
          );

        }

        return data;

      } catch (error) {

        if (
          attempt <
          MAX_RETRIES - 1
        ) {

          const delay =
            RETRY_DELAY *
            (attempt + 1);

          setStatus(
            "Retrying request...",
            `${error.message} · retry ${
              attempt + 2
            }/${MAX_RETRIES}`,
            "error"
          );

          await sleep(delay);

          return getJson(
            path,
            attempt + 1
          );

        }

        throw error;

      }

    }


    async function getInfo() {

      return await getJson(
        "/info"
      );

    }


    /*
      ============================================================
      UTILITIES
      ============================================================
    */

    function sleep(ms) {

      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            ms
          )
      );

    }


    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function shortHash(
      value,
      start = 8,
      end = 8
    ) {

      const text =
        String(value || "");

      if (
        text.length <=
        start + end + 3
      ) {

        return text;

      }

      return (
        text.slice(0, start) +
        "..." +
        text.slice(-end)
      );

    }


    function formatTimestamp(value) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return "Unknown time";

      }

      const n =
        Number(value);

      if (
        !Number.isFinite(n)
      ) {

        const d =
          new Date(value);

        return Number.isNaN(
          d.getTime()
        )
          ? "Unknown time"
          : d.toLocaleString();

      }

      let milliseconds;

      if (n < 1e12) {

        milliseconds =
          n * 1000;

      } else if (n < 1e15) {

        milliseconds =
          n;

      } else if (n < 1e18) {

        milliseconds =
          n / 1000;

      } else {

        milliseconds =
          n / 1000000;

      }

      const d =
        new Date(milliseconds);

      return Number.isNaN(
        d.getTime()
      )
        ? "Unknown time"
        : d.toLocaleString();

    }


    function formatAmount(value) {

      const n =
        Number(value);

      if (
        !Number.isFinite(n)
      ) {

        return escapeHtml(
          value ?? "0"
        );

      }

      /*
        NEV369 uses 8 decimal places.
      */

      const nev =
        n / 100000000;

      return (
        new Intl.NumberFormat(
          undefined,
          {
            maximumFractionDigits: 8
          }
        ).format(nev) +
        " NEV"
      );

    }


    function isRewardWhisper(item) {

      const sender =
        String(
          item.sender || ""
        ).trim()
        .toUpperCase();

      const memo =
        String(
          item.memo || ""
        ).trim();

      if (
        sender ===
        "NETWORK_REWARD"
      ) {

        return true;

      }

      if (
        /^Block\s+\d+\s+reward$/i
          .test(memo)
      ) {

        return true;

      }

      return false;

    }


    /*
      ============================================================
      EXPLORER LINKS
      ============================================================
    */

    function txExplorerUrl(
      txHash
    ) {

      return (
        "https://q-lock-ecosystem.com/explorer/#/tx/" +
        encodeURIComponent(
          txHash
        )
      );

    }


    /*
      Address links are kept compact.
      The exact explorer route may differ between
      implementations, so address text remains clickable
      using the explorer's search/address fragment.
    */

    function addressExplorerUrl(
      address
    ) {

      return (
        "https://q-lock-ecosystem.com/explorer/#/address/" +
        encodeURIComponent(
          address
        )
      );

    }


    /*
      ============================================================
      WHISPER EXTRACTION
      ============================================================
    */

    function extractWhispers(
      result
    ) {

      const source =
        Array.isArray(
          result?.whispers
        )
          ? result.whispers
          : [];

      const output = [];

      for (
        const item of source
      ) {

        if (
          !item
        ) {

          continue;

        }

        const memo =
          String(
            item.memo || ""
          ).trim();

        const txHash =
          String(
            item.tx_hash || ""
          ).trim();

        if (
          !memo ||
          !txHash
        ) {

          continue;

        }

        if (
          isRewardWhisper(item)
        ) {

          continue;

        }

        output.push({

          block:
            Number(
              item.block ?? 0
            ),

          timestamp:
            item.timestamp ??
            null,

          tx_hash:
            txHash,

          sender:
            String(
              item.sender || ""
            ),

          recipient:
            String(
              item.recipient || ""
            ),

          amount:
            item.amount ??
            0,

          fee:
            item.fee ??
            0,

          memo

        });

      }

      return output;

    }


    async function mergeWhispers(
      items
    ) {

      for (
        const item of items
      ) {

        state.whispers.set(
          item.tx_hash,
          item
        );

        await dbPut(
          "whispers",
          item
        );

      }

    }


    /*
      ============================================================
      SCANNING
      ============================================================
    */

    async function scanBatch(
      startHeight,
      endHeight
    ) {

      /*
        Worker expects:
        from = higher block
        to   = lower block

        Frontend presents:
        start → end
      */

      const result =
        await getJson(
          `/whispers?from=${endHeight}&to=${startHeight}`
        );

      if (
        Array.isArray(
          result.errors
        ) &&
        result.errors.length > 0
      ) {

        const first =
          result.errors[0];

        throw new Error(
          `Block ${first.height}: ${first.error}`
        );

      }

      const whispers =
        extractWhispers(result);

      await mergeWhispers(
        whispers
      );

      /*
        Only after every block in this
        batch has succeeded do we advance
        the verified frontier.
      */

      state.verifiedThrough =
        endHeight;

      state.blocksSinceTipCheck +=
        endHeight -
        startHeight +
        1;

      await saveState();

      render();

    }


    async function startScan() {

      if (
        state.scanning
      ) {

        return;

      }

      state.scanning =
        true;

      state.stopRequested =
        false;

      updateButtons();

      hideError();

      try {

        let info =
          await getInfo();

        let chainHeight =
          Number(
            info.height ??
            info.chain_height ??
            0
          );

        state.chainHeight =
          chainHeight;

        await saveState();

        render();

        setStatus(
          "Scanning Genesis → current",
          `Starting from block ${
            state.verifiedThrough + 1
          }`,
          "running"
        );

        while (
          !state.stopRequested
        ) {

          /*
            If we have reached the current tip,
            verify the tip before declaring current.
          */

          if (
            state.verifiedThrough >=
            state.chainHeight
          ) {

            info =
              await getInfo();

            chainHeight =
              Number(
                info.height ??
                info.chain_height ??
                0
              );

            state.chainHeight =
              chainHeight;

            await saveState();

            render();

            if (
              state.verifiedThrough >=
              state.chainHeight
            ) {

              setStatus(
                "Chain current",
                `Verified through #${
                  state.verifiedThrough
                }`,
                "current"
              );

              break;

            }

            continue;

          }


          /*
            Periodically re-check the live tip.
          */

          if (
            state.blocksSinceTipCheck >=
            TIP_CHECK_INTERVAL
          ) {

            info =
              await getInfo();

            chainHeight =
              Number(
                info.height ??
                info.chain_height ??
                0
              );

            state.chainHeight =
              chainHeight;

            state.blocksSinceTipCheck =
              0;

            await saveState();

            render();

          }


          const start =
            state.verifiedThrough + 1;

          const end =
            Math.min(
              start + BATCH_SIZE - 1,
              state.chainHeight
            );

          setStatus(
            `Scanning #${start} → #${end}`,
            `Genesis verified through #${
              state.verifiedThrough
            }`,
            "running"
          );

          await scanBatch(
            start,
            end
          );

          if (
            state.stopRequested
          ) {

            break;

          }

        }

      } catch (error) {

        console.error(
          "Scan failed:",
          error
        );

        showError(
          error.message
        );

        setStatus(
          "Scan paused",
          "The verified frontier was not advanced past the failed batch.",
          "error"
        );

      } finally {

        state.scanning =
          false;

        updateButtons();

        render();

        if (
          state.stopRequested
        ) {

          setStatus(
            "Scan stopped",
            `Safe checkpoint: verified through #${
              state.verifiedThrough
            }`,
            "idle"
          );

        }

      }

    }


    function stopScan() {

      if (
        !state.scanning
      ) {

        return;

      }

      state.stopRequested =
        true;

      setStatus(
        "Stopping...",
        "Finishing the current request safely.",
        "running"
      );

      updateButtons();

    }


    async function rebuildFromGenesis() {

      if (
        state.scanning
      ) {

        return;

      }

      const confirmed =
        confirm(
          "Rebuild the scanner from Genesis? This will erase the saved verification frontier and whisper database."
        );

      if (
        !confirmed
      ) {

        return;

      }

      state.verifiedThrough =
        -1;

      state.chainHeight =
        -1;

      state.whispers.clear();

      state.blocksSinceTipCheck =
        0;

      hideError();

      try {

        await dbClear(
          "meta"
        );

        await dbClear(
          "whispers"
        );

        await saveState();

        render();

        setStatus(
          "Reset complete",
          "Press Start Scan to begin again at Genesis.",
          "idle"
        );

      } catch (error) {

        showError(
          error.message
        );

      }

    }


    /*
      ============================================================
      RENDERING
      ============================================================
    */

    function render() {

      document.getElementById(
        "chainHeight"
      ).textContent =
        state.chainHeight >= 0
          ? `#${state.chainHeight}`
          : "—";

      document.getElementById(
        "verifiedThrough"
      ).textContent =
        state.verifiedThrough >= 0
          ? `#${state.verifiedThrough}`
          : "—";

      document.getElementById(
        "whisperCount"
      ).textContent =
        state.whispers.size;

      const remaining =
        state.chainHeight >= 0
          ? Math.max(
              0,
              state.chainHeight -
              state.verifiedThrough
            )
          : null;

      document.getElementById(
        "blocksRemaining"
      ).textContent =
        remaining === null
          ? "—"
          : remaining;

      let progress = 0;

      if (
        state.chainHeight >= 0 &&
        state.verifiedThrough >= 0
      ) {

        progress =
          Math.min(
            100,
            (
              (state.verifiedThrough + 1) /
              (state.chainHeight + 1)
            ) *
            100
          );

      }

      document.getElementById(
        "progressBar"
      ).style.width =
        `${progress}%`;

      renderFeed();

    }


    function renderFeed() {

      const feed =
        document.getElementById(
          "feed"
        );

      const query =
        document.getElementById(
          "searchInput"
        ).value
        .trim()
        .toLowerCase();

      const items =
        Array.from(
          state.whispers.values()
        )
        .filter(item => {

          if (!query) {

            return true;

          }

          return [
            item.memo,
            item.sender,
            item.recipient,
            item.tx_hash,
            String(item.block)
          ]
            .join(" ")
            .toLowerCase()
            .includes(query);

        })
        .sort((a, b) => {

          if (
            b.block !==
            a.block
          ) {

            return b.block -
              a.block;

          }

          return String(
            b.tx_hash
          ).localeCompare(
            String(a.tx_hash)
          );

        });

      if (
        items.length === 0
      ) {

        feed.innerHTML =
          `<div class="empty">
            ${
              query
                ? "No whispers match your search."
                : "No whispers loaded yet."
            }
          </div>`;

        return;

      }

      feed.innerHTML =
        items
          .map(
            renderWhisper
          )
          .join("");

    }


    function renderWhisper(
      item
    ) {

      const block =
        Number(
          item.block
        );

      const tx =
        escapeHtml(
          item.tx_hash
        );

      const sender =
        String(
          item.sender || ""
        );

      const recipient =
        String(
          item.recipient || ""
        );

      const senderDisplay =
        sender
          ? shortHash(
              sender,
              10,
              8
            )
          : "Unknown";

      const recipientDisplay =
        recipient
          ? shortHash(
              recipient,
              10,
              8
            )
          : "Unknown";

      const txDisplay =
        shortHash(
          tx,
          10,
          10
        );

      return `
        <article class="whisper">

          <div class="whisper-head">

            <div class="block">
              #${escapeHtml(block)}
            </div>

            <div class="time">
              ${escapeHtml(
                formatTimestamp(
                  item.timestamp
                )
              )}
            </div>

          </div>

          <div class="memo">
            ${escapeHtml(
              item.memo
            )}
          </div>

          <div class="details">

            <div class="detail-label">
              Amount
            </div>

            <div class="detail-value amount">
              ${formatAmount(
                item.amount
              )}
            </div>


            <div class="detail-label">
              TX
            </div>

            <div class="detail-value">

              <a
                class="hash-link"
                href="${txExplorerUrl(
                  tx
                )}"
                target="_blank"
                rel="noopener noreferrer"
                title="${tx}"
              >
                <span class="short">
                  ${txDisplay}
                </span>

                <span class="external">
                  ↗
                </span>
              </a>

            </div>


            <div class="detail-label">
              From
            </div>

            <div class="detail-value">

              ${
                sender
                  ? `
                    <a
                      class="address-link"
                      href="${addressExplorerUrl(
                        sender
                      )}"
                      target="_blank"
                      rel="noopener noreferrer"
                      title="${escapeHtml(
                        sender
                      )}"
                    >
                      <span class="short">
                        ${escapeHtml(
                          senderDisplay
                        )}
                      </span>

                      <span class="external">
                        ↗
                      </span>
                    </a>
                  `
                  : "Unknown"
              }

            </div>


            <div class="detail-label">
              To
            </div>

            <div class="detail-value">

              ${
                recipient
                  ? `
                    <a
                      class="address-link"
                      href="${addressExplorerUrl(
                        recipient
                      )}"
                      target="_blank"
                      rel="noopener noreferrer"
                      title="${escapeHtml(
                        recipient
                      )}"
                    >
                      <span class="short">
                        ${escapeHtml(
                          recipientDisplay
                        )}
                      </span>

                      <span class="external">
                        ↗
                      </span>
                    </a>
                  `
                  : "Unknown"
              }

            </div>

          </div>

        </article>
      `;

    }


    /*
      ============================================================
      STATUS / BUTTONS
      ============================================================
    */

    function setStatus(
      title,
      detail,
      mode = "idle"
    ) {

      document.getElementById(
        "statusText"
      ).textContent =
        title;

      document.getElementById(
        "statusDetail"
      ).textContent =
        detail;

      const pill =
        document.getElementById(
          "statusPill"
        );

      pill.className =
        "status-pill";

      if (
        mode === "running"
      ) {

        pill.classList.add(
          "running"
        );

        pill.textContent =
          "SCANNING";

      } else if (
        mode === "current"
      ) {

        pill.classList.add(
          "current"
        );

        pill.textContent =
          "CURRENT";

      } else if (
        mode === "error"
      ) {

        pill.classList.add(
          "error"
        );

        pill.textContent =
          "ERROR";

      } else {

        pill.textContent =
          "IDLE";

      }

    }


    function updateButtons() {

      const running =
        state.scanning;

      document.getElementById(
        "startBtn"
      ).disabled =
        running;

      document.getElementById(
        "stopBtn"
      ).disabled =
        !running;

      document.getElementById(
        "rebuildBtn"
      ).disabled =
        running;

    }


    function showError(
      message
    ) {

      const box =
        document.getElementById(
          "errorBox"
        );

      box.textContent =
        message;

      box.style.display =
        "block";

    }


    function hideError() {

      const box =
        document.getElementById(
          "errorBox"
        );

      box.textContent =
        "";

      box.style.display =
        "none";

    }


    /*
      ============================================================
      STARTUP
      ============================================================
    */

    async function initialise() {

      try {

        await openDatabase();

        await loadState();

        await loadWhispers();

        render();

        setStatus(
          "Ready",
          state.verifiedThrough >= 0
            ? `Saved checkpoint: verified through #${state.verifiedThrough}. Press Start Scan to continue.`
            : "Press Start Scan to verify the NEV369 chain from Genesis.",
          "idle"
        );

        updateButtons();

      } catch (error) {

        console.error(
          "Initialisation failed:",
          error
        );

        showError(
          error.message
        );

        setStatus(
          "Initialisation failed",
          "IndexedDB could not be opened.",
          "error"
        );

      }

    }


    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(
        "input",
        renderFeed
      );


    initialise();


    /*
      ============================================================
      PERIODIC LIVE CHECK
      ============================================================

      This does NOT start immediately.

      If the page is left open and idle for 369 seconds,
      it will resume scanning to pick up new blocks.
    */

    setInterval(() => {

      if (
        !state.scanning
      ) {

        startScan();

      }

    }, AUTO_REFRESH_MS);

  </script>

</body>
