name: Audit NEV369 block dedications

on:
  push:
    paths:
      - ".github/workflows/audit-dedications.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect historical dedication coverage
        run: |
          node <<'NODE'
          const BASE = "https://q-lock-ecosystem.com/node";

          async function get(path) {
            const r = await fetch(BASE + path, { headers: { accept: "application/json" } });
            if (!r.ok) throw new Error(path + " HTTP " + r.status);
            return r.json();
          }

          for (const path of ["/chain?limit=10000", "/chain?limit=7000", "/chain?offset=0&limit=7000"]) {
            try {
              const data = await get(path);
              const blocks = Array.isArray(data) ? data : (Array.isArray(data.blocks) ? data.blocks : []);
              const dedicated = blocks.filter(b => String(b.block_dedication ?? b.dedication ?? "").trim());
              const heights = blocks.map(b => Number(b.index ?? b.height ?? b.block_height ?? b.block)).filter(Number.isFinite);
              console.log(path, "blocks", blocks.length, "dedicated", dedicated.length,
                "min", heights.length ? Math.min(...heights) : null,
                "max", heights.length ? Math.max(...heights) : null);
            } catch (e) {
              console.log(path, "FAILED", e.message);
            }
          }

          const info = await get("/info");
          const tip = Number(info.chain_height ?? info.height);
          console.log("tip", tip);

          const samples = [0,1,2,10,100,1000,2000,3000,4000,4700,5000,5960,6000,6500,6689,6729,tip]
            .filter((v,i,a) => Number.isInteger(v) && v >= 0 && v <= tip && a.indexOf(v) === i);

          for (const h of samples) {
            try {
              const b = await get("/block/" + h);
              console.log("sample", h, JSON.stringify(b.block_dedication ?? b.dedication ?? null));
            } catch (e) {
              console.log("sample", h, "FAILED", e.message);
            }
          }
          NODE
