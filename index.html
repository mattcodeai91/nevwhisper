<script>
"use strict";

/*
  ============================================================
  NevWhisper — NEV369 Memo Chat
  ============================================================

  Architecture:

  1. New blocks are always scanned first.
  2. A block becomes VERIFIED only when that exact block was
     successfully fetched.
  3. A block does NOT need to contain a memo to be verified.
  4. Verified blocks are never unnecessarily repaired again.
  5. Historical gaps are repaired in 10-block batches.
  6. Up to 3 batches can run concurrently.
  7. Memos are deduplicated by transaction hash.
  8. Network reward/system memos are hidden from the public feed.
  9. Timestamps are normalized from Unix seconds/milliseconds.
  ============================================================
*/

const NODE =
  "https://nevwhisper-proxy.mattcodeai91.workers.dev";

const BATCH_SIZE = 10;
const REPAIR_CONCURRENCY = 3;

const MEMO_KEY =
  "nevwhisper.memo-cache.v5";

const STATE_KEY =
  "nevwhisper.chain-state.v5";

const INIT_KEY =
  "nevwhisper.state.v5.initialized";

const OLD_KEYS = [
  "nevwhisper.memo-cache.v2",
  "nevwhisper.memo-cache.v3",
  "nevwhisper.memo-cache.v4",
  "nevwhisper.verified.v2",
  "nevwhisper.verified.v3",
  "nevwhisper.verified.v4",
  "nevwhisper.state.v2",
  "nevwhisper.state.v3",
  "nevwhisper.state.v4"
];

const state = {
  chainHeight: 0,

  /*
    verified = Set of exact block heights that were fetched
    successfully.
  */
  verified: new Set(),

  /*
    Failed heights are kept separate so they can be retried.
  */
  failed: new Set(),

  /*
    whispers = Map keyed by tx hash.
  */
  whispers: new Map(),

  scanning: false,

  mode: "idle",

  lastUpdated: null
};

const els = {
  statusDot:
    document.getElementById("statusDot"),

  statusText:
    document.getElementById("statusText"),

  refreshBtn:
    document.getElementById("refreshBtn"),

  rebuildBtn:
    document.getElementById("rebuildBtn"),

  searchInput:
    document.getElementById("searchInput"),

  progressLabel:
    document.getElementById("progressLabel"),

  progressPercent:
    document.getElementById("progressPercent"),

  progressBar:
    document.getElementById("progressBar"),

  progressDetail:
    document.getElementById("progressDetail"),

  chainHeight:
    document.getElementById("chainHeight"),

  verifiedBlocks:
    document.getElementById("verifiedBlocks"),

  whisperCount:
    document.getElementById("whisperCount"),

  repairQueue:
    document.getElementById("repairQueue"),

  feedCount:
    document.getElementById("feedCount"),

  feed:
    document.getElementById("feed")
};


/* ============================================================
   STORAGE
   ============================================================ */

function cleanupOldStorage() {
  if (localStorage.getItem(INIT_KEY)) {
    return;
  }

  for (const key of OLD_KEYS) {
    try {
      localStorage.removeItem(key);
    } catch {}
  }

  try {
    localStorage.setItem(INIT_KEY, "1");
  } catch {}
}


function loadState() {
  cleanupOldStorage();

  try {
    const raw =
      localStorage.getItem(STATE_KEY);

    if (raw) {
      const saved = JSON.parse(raw);

      if (
        saved &&
        Array.isArray(saved.verified)
      ) {
        state.verified =
          new Set(
            saved.verified
              .map(Number)
              .filter(Number.isFinite)
          );
      }

      if (
        saved &&
        Array.isArray(saved.failed)
      ) {
        state.failed =
          new Set(
            saved.failed
              .map(Number)
              .filter(Number.isFinite)
          );
      }

      state.chainHeight =
        Number(saved.chainHeight) || 0;
    }
  } catch (error) {
    console.warn(
      "Could not load chain state:",
      error
    );
  }

  try {
    const raw =
      localStorage.getItem(MEMO_KEY);

    if (raw) {
      const saved = JSON.parse(raw);

      if (Array.isArray(saved)) {
        for (const whisper of saved) {
          if (
            whisper &&
            whisper.tx_hash
          ) {
            state.whispers.set(
              String(whisper.tx_hash),
              whisper
            );
          }
        }
      }
    }
  } catch (error) {
    console.warn(
      "Could not load memo cache:",
      error
    );
  }
}


function saveState() {
  try {
    localStorage.setItem(
      STATE_KEY,
      JSON.stringify({
        chainHeight:
          state.chainHeight,

        verified:
          Array.from(
            state.verified
          ),

        failed:
          Array.from(
            state.failed
          )
      })
    );
  } catch (error) {
    console.warn(
      "Could not save chain state:",
      error
    );
  }
}


function saveWhispers() {
  try {
    localStorage.setItem(
      MEMO_KEY,
      JSON.stringify(
        Array.from(
          state.whispers.values()
        )
      )
    );
  } catch (error) {
    console.warn(
      "Could not save whispers:",
      error
    );
  }
}


/* ============================================================
   NETWORK
   ============================================================ */

async function getJson(path) {
  const response =
    await fetch(
      NODE + path,
      {
        method: "GET",
        cache: "no-store"
      }
    );

  const text =
    await response.text();

  let data;

  try {
    data = JSON.parse(text);
  } catch {
    throw new Error(
      `Invalid JSON from ${path}`
    );
  }

  if (!response.ok) {
    throw new Error(
      `${response.status}: ${
        data?.error ||
        response.statusText
      }`
    );
  }

  return data;
}


async function getInfo() {
  return await getJson("/info");
}


/* ============================================================
   TIMESTAMP
   ============================================================ */

function formatTimestamp(value) {
  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "Unknown time";
  }

  const n = Number(value);

  if (!Number.isFinite(n)) {
    const d =
      new Date(value);

    if (
      Number.isNaN(
        d.getTime()
      )
    ) {
      return "Unknown time";
    }

    return d.toLocaleString();
  }

  let ms;

  /*
    NEV369 currently exposes Unix timestamps in seconds.
    This also handles millisecond timestamps safely.
  */
  if (n < 1e12) {
    ms = n * 1000;
  } else if (n < 1e15) {
    ms = n;
  } else if (n < 1e18) {
    ms = n / 1000;
  } else {
    ms = n / 1000000;
  }

  const d =
    new Date(ms);

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {
    return "Unknown time";
  }

  return d.toLocaleString();
}


/* ============================================================
   BLOCK / MEMO EXTRACTION
   ============================================================ */

function actualBlockHeight(
  block,
  requestedHeight
) {
  const candidate =
    block?.index ??
    block?.height ??
    requestedHeight;

  const n =
    Number(candidate);

  return Number.isFinite(n)
    ? n
    : Number(requestedHeight);
}


function isSystemMemo(tx) {
  const sender =
    String(
      tx?.sender ??
      ""
    ).trim()
    .toUpperCase();

  const memo =
    String(
      tx?.payload_memo ??
      ""
    ).trim();

  /*
    NEV369 network reward transactions are not public
    human whispers.
  */
  if (
    sender === "NETWORK_REWARD"
  ) {
    return true;
  }

  if (
    /^Block\s+\d+\s+reward$/i.test(
      memo
    )
  ) {
    return true;
  }

  return false;
}


function extractWhispers(
  block,
  requestedHeight
) {
  if (!block) {
    return [];
  }

  const transactions =
    Array.isArray(
      block.transactions
    )
      ? block.transactions
      : [];

  const height =
    actualBlockHeight(
      block,
      requestedHeight
    );

  const results = [];

  for (const tx of transactions) {

    if (!tx) {
      continue;
    }

    const memo =
      typeof tx.payload_memo === "string"
        ? tx.payload_memo.trim()
        : "";

    if (!memo) {
      continue;
    }

    if (isSystemMemo(tx)) {
      continue;
    }

    const hash =
      String(
        tx.hash ??
        tx.tx_hash ??
        ""
      ).trim();

    /*
      A memo without a transaction hash cannot be safely
      deduplicated, so don't put it in the public index.
    */
    if (!hash) {
      continue;
    }

    results.push({
      block: height,

      timestamp:
        tx.timestamp ??
        block.timestamp ??
        null,

      tx_hash:
        hash,

      sender:
        tx.sender ??
        "",

      recipient:
        tx.recipient ??
        "",

      amount:
        tx.amount ??
        0,

      fee:
        tx.fee ??
        0,

      memo
    });
  }

  return results;
}


/* ============================================================
   WHISPER STORAGE
   ============================================================ */

function addWhispers(
  whispers
) {
  let changed = false;

  for (const whisper of whispers) {

    if (
      !whisper ||
      !whisper.tx_hash
    ) {
      continue;
    }

    const hash =
      String(
        whisper.tx_hash
      );

    const existing =
      state.whispers.get(
        hash
      );

    /*
      If we already have this transaction, retain it unless
      the newly observed data gives us a better block/timestamp.
    */
    if (!existing) {
      state.whispers.set(
        hash,
        {
          ...whisper,
          tx_hash: hash
        }
      );

      changed = true;
      continue;
    }

    const existingBlock =
      Number(
        existing.block
      );

    const newBlock =
      Number(
        whisper.block
      );

    if (
      Number.isFinite(newBlock) &&
      (
        !Number.isFinite(existingBlock) ||
        newBlock !== existingBlock ||
        existing.timestamp === null
      )
    ) {
      state.whispers.set(
        hash,
        {
          ...existing,
          ...whisper,
          tx_hash: hash
        }
      );

      changed = true;
    }
  }

  return changed;
}


/* ============================================================
   BLOCK FETCH
   ============================================================ */

async function scanBlock(
  height
) {
  const requested =
    Number(height);

  try {
    const block =
      await getJson(
        `/block/${requested}`
      );

    const actual =
      actualBlockHeight(
        block,
        requested
      );

    /*
      Mark the requested block as verified only after the
      fetch succeeded.
    */
    state.verified.add(
      requested
    );

    state.failed.delete(
      requested
    );

    /*
      If the node tells us the actual height, also record it
      as verified when it matches the requested block.
    */
    if (
      actual === requested
    ) {
      state.verified.add(
        actual
      );

      state.failed.delete(
        actual
      );
    }

    const whispers =
      extractWhispers(
        block,
        requested
      );

    addWhispers(
      whispers
    );

    return {
      ok: true,
      height: requested,
      actual,
      whispers
    };

  } catch (error) {

    state.failed.add(
      requested
    );

    return {
      ok: false,
      height: requested,
      error:
        String(error)
    };
  }
}


/* ============================================================
   CONTIGUOUS VERIFICATION FRONTIER
   ============================================================ */

function getVerifiedThrough() {
  let h = 0;

  /*
    Genesis block #0 must be verified before the frontier can
    move forward.
  */
  while (
    state.verified.has(h)
  ) {
    h++;
  }

  return h - 1;
}


function getUnverifiedCount(
  chainHeight
) {
  let count = 0;

  for (
    let h = 0;
    h <= chainHeight;
    h++
  ) {
    if (
      !state.verified.has(h)
    ) {
      count++;
    }
  }

  return count;
}


/* ============================================================
   PROGRESS UI
   ============================================================ */

function setStatus(
  online,
  text
) {
  els.statusText.textContent =
    text;

  if (online) {
    els.statusDot.classList.remove(
      "offline"
    );
  } else {
    els.statusDot.classList.add(
      "offline"
    );
  }
}


function updateProgress(
  label,
  percent,
  detail
) {
  const safe =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent) || 0
      )
    );

  els.progressLabel.textContent =
    label;

  els.progressPercent.textContent =
    `${Math.round(safe)}%`;

  els.progressBar.style.width =
    `${safe}%`;

  els.progressDetail.textContent =
    detail;
}


function updateStats() {
  const height =
    state.chainHeight;

  const verified =
    state.verified.size;

  const queue =
    height >= 0
      ? getUnverifiedCount(
          height
        )
      : 0;

  els.chainHeight.textContent =
    height >= 0
      ? `#${height}`
      : "—";

  els.verifiedBlocks.textContent =
    verified.toLocaleString();

  els.whisperCount.textContent =
    state.whispers.size.toLocaleString();

  els.repairQueue.textContent =
    queue.toLocaleString();

  renderFeed();
}


function renderFeed() {
  const query =
    els.searchInput.value
      .trim()
      .toLowerCase();

  let items =
    Array.from(
      state.whispers.values()
    );

  items.sort(
    (a, b) => {
      const blockDiff =
        Number(b.block || 0) -
        Number(a.block || 0);

      if (
        blockDiff !== 0
      ) {
        return blockDiff;
      }

      return String(
        b.tx_hash || ""
      ).localeCompare(
        String(
          a.tx_hash || ""
        )
      );
    }
  );

  if (query) {
    items =
      items.filter(
        whisper => {

          const haystack =
            [
              whisper.memo,
              whisper.tx_hash,
              whisper.sender,
              whisper.recipient,
              whisper.block
            ]
              .join(" ")
              .toLowerCase();

          return haystack.includes(
            query
          );
        }
      );
  }

  els.feedCount.textContent =
    `${items.length.toLocaleString()} whisper${
      items.length === 1
        ? ""
        : "s"
    }`;

  if (!items.length) {
    els.feed.innerHTML = `
      <div class="empty">
        ${
          query
            ? "No whispers match your search."
            : "No public whispers loaded yet."
        }
      </div>
    `;

    return;
  }

  const fragment =
    document.createDocumentFragment();

  /*
    Keep the public feed manageable even if the chain eventually
    contains a very large number of whispers.
  */
  const visible =
    items.slice(0, 500);

  for (const whisper of visible) {

    const card =
      document.createElement(
        "article"
      );

    card.className =
      "card";

    const block =
      Number(
        whisper.block
      );

    const tx =
      String(
        whisper.tx_hash || ""
      );

    const sender =
      String(
        whisper.sender || ""
      );

    const recipient =
      String(
        whisper.recipient || ""
      );

    const amount =
      Number(
        whisper.amount
      );

    const amountText =
      Number.isFinite(amount)
        ? `${amount} NEV`
        : String(
            whisper.amount ?? ""
          );

    card.innerHTML = `
      <div class="card-top">
        <div class="block">
          #${Number.isFinite(block) ? block : "?"}
        </div>

        <div class="time">
          ${escapeHtml(
            formatTimestamp(
              whisper.timestamp
            )
          )}
        </div>
      </div>

      <div class="memo">
        ${escapeHtml(
          whisper.memo || ""
        )}
      </div>

      <div class="meta">

        <div>
          <strong>TX</strong>
          <span class="hash">
            ${escapeHtml(
              tx
            )}
          </span>
        </div>

        <div>
          <strong>From:</strong>
          <span class="hash">
            ${escapeHtml(
              sender
            )}
          </span>
        </div>

        <div>
          <strong>To:</strong>
          <span class="hash">
            ${escapeHtml(
              recipient
            )}
          </span>
        </div>

        <div>
          <strong>Amount:</strong>
          ${escapeHtml(
            amountText
          )}
        </div>

      </div>
    `;

    fragment.appendChild(
      card
    );
  }

  els.feed.innerHTML = "";
  els.feed.appendChild(
    fragment
  );
}


function escapeHtml(
  value
) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ============================================================
   RANGE HELPERS
   ============================================================ */

function makeRanges(
  from,
  to
) {
  const ranges = [];

  let cursor =
    Number(from);

  const end =
    Number(to);

  while (
    cursor >= end
  ) {
    const batchEnd =
      Math.max(
        end,
        cursor - BATCH_SIZE + 1
      );

    ranges.push({
      from: cursor,
      to: batchEnd
    });

    cursor =
      batchEnd - 1;
  }

  return ranges;
}


/*
  Build only ranges containing blocks that are not verified.

  This is the key part that prevents already verified blocks
  from being repeatedly repaired.
*/
function getRepairRanges(
  chainHeight
) {
  const ranges = [];

  let h =
    chainHeight;

  while (h >= 0) {

    while (
      h >= 0 &&
      state.verified.has(h)
    ) {
      h--;
    }

    if (h < 0) {
      break;
    }

    const rangeFrom =
      h;

    let count = 0;

    while (
      h >= 0 &&
      count < BATCH_SIZE &&
      !state.verified.has(h)
    ) {
      h--;
      count++;
    }

    ranges.push({
      from: rangeFrom,
      to: h + 1
    });
  }

  return ranges;
}


/* ============================================================
   BATCH SCANNING
   ============================================================ */

async function scanBatch(
  range
) {
  const result =
    await getJson(
      `/whispers?from=${range.from}&to=${range.to}`
    );

  /*
    The Worker may return whispers from the batch, but the
    frontend does NOT use Worker.next to determine verification.
  */
  if (
    Array.isArray(
      result.whispers
    )
  ) {
    addWhispers(
      result.whispers
    );
  }

  /*
    Mark only the heights that were actually successful.

    The Worker returns an errors array for individual failed
    block requests.
  */
  const failedHeights =
    new Set(
      Array.isArray(
        result.errors
      )
        ? result.errors
            .map(
              error =>
                Number(
                  error.height
                )
            )
            .filter(
              Number.isFinite
            )
        : []
    );

  for (
    let h = range.from;
    h >= range.to;
    h--
  ) {
    if (
      failedHeights.has(h)
    ) {
      state.failed.add(h);
      state.verified.delete(h);
    } else {
      state.verified.add(h);
      state.failed.delete(h);
    }
  }

  return {
    ...result,
    range
  };
}


/* ============================================================
   CONCURRENT RANGE WORKER
   ============================================================ */

async function processRanges(
  ranges,
  phaseLabel,
  totalAtStart,
  completedAtStart
) {
  let nextIndex = 0;
  let completed =
    completedAtStart;

  async function worker() {

    while (true) {

      const index =
        nextIndex++;

      if (
        index >= ranges.length
      ) {
        return;
      }

      const range =
        ranges[index];

      try {

        await scanBatch(
          range
        );

      } catch (error) {

        /*
          If the entire Worker request fails, mark every block
          in this requested range as failed so it will be retried
          on a later scan.
        */
        for (
          let h = range.from;
          h >= range.to;
          h--
        ) {
          state.failed.add(h);
          state.verified.delete(h);
        }

        console.warn(
          "Batch failed:",
          range,
          error
        );
      }

      completed +=
        range.from -
        range.to +
        1;

      const percent =
        totalAtStart > 0
          ? (
              completed /
              totalAtStart
            ) * 100
          : 100;

      updateProgress(
        phaseLabel,
        percent,
        `Scanned ${completed.toLocaleString()} of ${totalAtStart.toLocaleString()} blocks in this phase.`
      );

      updateStats();
      saveState();
      saveWhispers();
    }
  }

  const workers =
    Array.from(
      {
        length:
          Math.min(
            REPAIR_CONCURRENCY,
            ranges.length
          )
      },
      () => worker()
    );

  await Promise.all(
    workers
  );
}


/* ============================================================
   NEW BLOCK SCAN
   ============================================================ */

async function scanNewBlocks(
  chainHeight
) {
  /*
    The contiguous frontier is the highest point at which every
    block from genesis through that point has been verified.
  */
  const frontier =
    getVerifiedThrough();

  const firstNew =
    frontier + 1;

  if (
    firstNew > chainHeight
  ) {
    return {
      scanned: 0
    };
  }

  const ranges =
    makeRanges(
      chainHeight,
      firstNew
    );

  /*
    New blocks are scanned sequentially by batch range, newest
    first. This guarantees the user's newest memo is discovered
    before historical repair begins.
  */
  let completed = 0;

  for (const range of ranges) {

    try {

      await scanBatch(
        range
      );

    } catch (error) {

      for (
        let h = range.from;
        h >= range.to;
        h--
      ) {
        state.failed.add(h);
        state.verified.delete(h);
      }

      console.warn(
        "New-block batch failed:",
        range,
        error
      );
    }

    completed +=
      range.from -
      range.to +
      1;

    const frontierNow =
      getVerifiedThrough();

    const percent =
      chainHeight >= 0
        ? (
            Math.max(
              0,
              frontierNow + 1
            ) /
            (chainHeight + 1)
          ) * 100
        : 100;

    updateProgress(
      "Scanning new blocks",
      percent,
      `Newest block first · verified through #${Math.max(frontierNow, -1)}`
    );

    updateStats();
    saveState();
    saveWhispers();
  }

  return {
    scanned: completed
  };
}


/* ============================================================
   HISTORICAL REPAIR
   ============================================================ */

async function repairHistorical(
  chainHeight
) {
  const ranges =
    getRepairRanges(
      chainHeight
    );

  if (!ranges.length) {
    return {
      repaired: 0,
      remaining: 0
    };
  }

  const total =
    ranges.reduce(
      (sum, range) =>
        sum +
        (
          range.from -
          range.to +
          1
        ),
      0
    );

  /*
    Completed is counted from the repair work itself. It is not
    the same thing as verified.size.
  */
  await processRanges(
    ranges,
    "Repairing historical blocks",
    total,
    0
  );

  return {
    repaired: total,
    remaining:
      getUnverifiedCount(
        chainHeight
      )
  };
}


/* ============================================================
   MAIN SCAN
   ============================================================ */

async function refresh() {
  if (state.scanning) {
    return;
  }

  state.scanning = true;

  els.refreshBtn.disabled =
    true;

  els.rebuildBtn.disabled =
    true;

  try {

    setStatus(
      true,
      "Connected · NEV369"
    );

    const info =
      await getInfo();

    const chainHeight =
      Number(
        info.height ??
        info.chain_height
      );

    if (
      !Number.isFinite(
        chainHeight
      )
    ) {
      throw new Error(
        "Node returned an invalid chain height."
      );
    }

    state.chainHeight =
      Math.floor(
        chainHeight
      );

    /*
      ==========================================================
      PHASE 1 — NEW BLOCKS FIRST
      ==========================================================
    */

    const hasExistingState =
      state.verified.size > 0;

    if (
      !hasExistingState
    ) {

      /*
        First-ever run.

        Do NOT pretend the whole chain is "new". Instead, start
        with historical repair from genesis. This avoids the old
        misleading #5769 -> #0 "new blocks" scan.
      */

      updateProgress(
        "Building chain index",
        0,
        `Initial scan of NEV369 from #0 to #${state.chainHeight}`
      );

    } else {

      await scanNewBlocks(
        state.chainHeight
      );
    }

    /*
      ==========================================================
      PHASE 2 — HISTORICAL REPAIR
      ==========================================================
    */

    const repair =
      await repairHistorical(
        state.chainHeight
      );

    /*
      ==========================================================
      PHASE 3 — FINAL NEW-BLOCK CATCH-UP
      ==========================================================
    */

    /*
      The chain may have advanced while repair was running.
      Ask the node again before declaring the scan complete.
    */
    const latestInfo =
      await getInfo();

    const latestHeight =
      Number(
        latestInfo.height ??
        latestInfo.chain_height
      );

    if (
      Number.isFinite(
        latestHeight
      )
    ) {
      state.chainHeight =
        Math.floor(
          latestHeight
        );
    }

    await scanNewBlocks(
      state.chainHeight
    );

    /*
      One final repair pass catches any failed blocks that
      appeared during the scan.
    */
    const remaining =
      getUnverifiedCount(
        state.chainHeight
      );

    if (
      remaining > 0
    ) {
      updateProgress(
        "Retrying unverified blocks",
        99,
        `${remaining.toLocaleString()} block(s) still need verification.`
      );

      await repairHistorical(
        state.chainHeight
      );
    }

    state.lastUpdated =
      Date.now();

    saveState();
    saveWhispers();

    const finalFrontier =
      getVerifiedThrough();

    const finalQueue =
      getUnverifiedCount(
        state.chainHeight
      );

    if (
      finalQueue === 0 &&
      finalFrontier >=
        state.chainHeight
    ) {

      updateProgress(
        "Chain fully verified",
        100,
        `Genesis #0 through #${state.chainHeight} verified · future scans will only process new blocks.`
      );

    } else {

      const percent =
        (
          Math.max(
            0,
            finalFrontier + 1
          ) /
          (
            state.chainHeight + 1
          )
        ) * 100;

      updateProgress(
        "Scan complete · historical gaps remain",
        percent,
        `${finalQueue.toLocaleString()} block(s) still need verification. They will be retried on the next scan.`
      );
    }

    updateStats();

  } catch (error) {

    console.error(
      "NevWhisper scan error:",
      error
    );

    setStatus(
      false,
      "Node connection problem"
    );

    updateProgress(
      "Scan failed",
      0,
      String(error)
    );

  } finally {

    state.scanning =
      false;

    els.refreshBtn.disabled =
      false;

    els.rebuildBtn.disabled =
      false;
  }
}


/* ============================================================
   REBUILD
   ============================================================ */

async function rebuild() {
  if (state.scanning) {
    return;
  }

  const confirmed =
    window.confirm(
      "Rebuild the NevWhisper chain index from Genesis?\n\nThis clears the local verification state and whisper cache, then scans NEV369 again from block #0."
    );

  if (!confirmed) {
    return;
  }

  try {
    localStorage.removeItem(
      STATE_KEY
    );

    localStorage.removeItem(
      MEMO_KEY
    );

    state.chainHeight = 0;
    state.verified.clear();
    state.failed.clear();
    state.whispers.clear();

    updateStats();

  } catch (error) {
    console.warn(
      "Could not clear local state:",
      error
    );
  }

  await refresh();
}


/* ============================================================
   EVENTS
   ============================================================ */

els.refreshBtn.addEventListener(
  "click",
  refresh
);

els.rebuildBtn.addEventListener(
  "click",
  rebuild
);

els.searchInput.addEventListener(
  "input",
  renderFeed
);


/* ============================================================
   AUTO REFRESH
   ============================================================ */

/*
  NEV369 targets roughly 60-second blocks.

  369 seconds keeps this public frontend lightweight while
  still catching new whispers regularly.
*/
setInterval(
  () => {
    refresh();
  },
  369000
);


/* ============================================================
   START
   ============================================================ */

loadState();
updateStats();

refresh();

</script>

</body>
</html>
