<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NevWhisper — NEV369 Memo Chat</title>

  <style>
    :root {
      --bg: #0b0d12;
      --card: #151820;
      --card-hover: #1c202b;
      --text: #e8eaed;
      --muted: #8b92a5;
      --accent: #7c6cff;
      --border: #252a36;
      --green: #34d399;
      --red: #fb7185;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #a78bfa, #7c6cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: var(--muted);
      gap: 12px;
    }

    .status-left {
      display: flex;
      align-items: center;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    .live-dot.error {
      background: var(--red);
      animation: none;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 9px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
    }

    #feed {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .memo {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      transition: all 0.25s ease;
      animation: fadeIn 0.4s ease;
    }

    .memo:hover {
      background: var(--card-hover);
      border-color: #323846;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .meta {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .memo-text {
      font-size: 1.05rem;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .empty,
    .loading {
      text-align: center;
      color: var(--muted);
      padding: 50px 20px;
      font-size: 1rem;
    }

    .error-box {
      background: rgba(251, 113, 133, 0.08);
      border: 1px solid rgba(251, 113, 133, 0.25);
      color: #fda4af;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      word-break: break-word;
    }

    .amount {
      color: var(--green);
      font-weight: 500;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .node-info {
      margin-top: 10px;
      font-size: 0.72rem;
      color: #687084;
      text-align: center;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>NevWhisper</h1>
      <div class="subtitle">
        Quiet messages from the NEV369 chain · Refreshes every 369 seconds
      </div>
    </header>

    <div class="status-bar">
      <div class="status-left">
        <span id="liveDot" class="live-dot"></span>
        <span id="status">Connecting...</span>
      </div>

      <div id="count"></div>
    </div>

    <div class="controls">
      <button id="refreshBtn" onclick="loadMemos()">
        Refresh Now
      </button>

      <label class="checkbox-label">
        <input type="checkbox" id="autoRefresh" checked>
        Auto-refresh (369s)
      </label>
    </div>

    <div id="feed">
      <div class="loading">
        Listening for whispers on the chain...
      </div>
    </div>

    <div class="node-info">
      Reading the public NEV369 node at q-lock-ecosystem.com/node
    </div>

    <footer>
      Public memos from the
      <a
        href="https://q-lock-ecosystem.com"
        target="_blank"
        rel="noopener"
      >
        NEV369
      </a>
      network · Fully on-chain & open
    </footer>

  </div>

  <script>
    /*
     * NevWhisper
     *
     * The official Q-Lock Explorer exposes NEV369 chain data
     * through the configured /node endpoint.
     *
     * We request /node/explorer and recursively search the
     * returned object for blocks and payload_memo fields.
     */

    const NODE = "https://q-lock-ecosystem.com/node";
    const EXPLORER_API = NODE + "/explorer";

    const REFRESH_MS = 369 * 1000;

    let autoTimer = null;

    function formatTime(ts) {
      if (ts === undefined || ts === null || ts === "") {
        return "—";
      }

      let value = Number(ts);

      if (!Number.isFinite(value)) {
        const d = new Date(ts);

        if (Number.isNaN(d.getTime())) {
          return "—";
        }

        return d.toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      /*
       * Handle both Unix seconds and milliseconds.
       */
      if (value < 100000000000) {
        value *= 1000;
      }

      const d = new Date(value);

      if (Number.isNaN(d.getTime())) {
        return "—";
      }

      return d.toLocaleString([], {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function shortAddr(addr) {
      if (!addr) {
        return "—";
      }

      addr = String(addr);

      if (addr.length < 16) {
        return addr;
      }

      return addr.slice(0, 8) + "…" + addr.slice(-5);
    }

    function formatAmount(amount) {
      if (
        amount === undefined ||
        amount === null ||
        amount === ""
      ) {
        return "";
      }

      const nev = Number(amount);

      if (!Number.isFinite(nev) || nev === 0) {
        return "";
      }

      return nev.toLocaleString(undefined, {
        maximumFractionDigits: 8
      }) + " NEV";
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = String(text ?? "");
      return div.innerHTML;
    }

    /*
     * Recursively find every object containing payload_memo.
     *
     * This makes the frontend tolerant of the current Explorer's
     * response structure without assuming a specific nesting level.
     */
    function findMemoTransactions(value, results = []) {
      if (!value || typeof value !== "object") {
        return results;
      }

      if (Array.isArray(value)) {
        for (const item of value) {
          findMemoTransactions(item, results);
        }

        return results;
      }

      if (
        Object.prototype.hasOwnProperty.call(value, "payload_memo") &&
        value.payload_memo !== null &&
        value.payload_memo !== undefined &&
        String(value.payload_memo).trim() !== ""
      ) {
        results.push(value);
      }

      for (const key of Object.keys(value)) {
        const child = value[key];

        if (
          child &&
          typeof child === "object"
        ) {
          findMemoTransactions(child, results);
        }
      }

      return results;
    }

    /*
     * Find the block height associated with a transaction by
     * walking the chain recursively.
     */
    function collectChainBlocks(value, blocks = []) {
      if (!value || typeof value !== "object") {
        return blocks;
      }

      if (Array.isArray(value)) {
        for (const item of value) {
          collectChainBlocks(item, blocks);
        }

        return blocks;
      }

      const hasTransactions =
        Array.isArray(value.transactions) ||
        Array.isArray(value.txs);

      const hasHeight =
        value.height !== undefined ||
        value.index !== undefined ||
        value.block_height !== undefined ||
        value.number !== undefined;

      if (hasTransactions && hasHeight) {
        blocks.push(value);
      }

      for (const key of Object.keys(value)) {
        const child = value[key];

        if (
          child &&
          typeof child === "object"
        ) {
          collectChainBlocks(child, blocks);
        }
      }

      return blocks;
    }

    function extractBlockHeight(tx, allBlocks) {
      if (tx.block_height !== undefined) {
        return tx.block_height;
      }

      if (tx.height !== undefined) {
        return tx.height;
      }

      if (tx.block !== undefined) {
        if (
          typeof tx.block === "object" &&
          tx.block !== null
        ) {
          return (
            tx.block.height ??
            tx.block.index ??
            tx.block.number ??
            "—"
          );
        }

        return tx.block;
      }

      return "—";
    }

    async function fetchExplorer() {
      const controller = new AbortController();

      const timeout = setTimeout(
        () => controller.abort(),
        15000
      );

      try {
        const response = await fetch(EXPLORER_API, {
          method: "GET",
          headers: {
            "Accept": "application/json,text/plain,*/*"
          },
          cache: "no-store",
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error(
            "Node returned HTTP " + response.status
          );
        }

        const text = await response.text();

        /*
         * Some deployments return JSON with an unusual content type.
         * Therefore we parse the body ourselves instead of requiring
         * application/json.
         */
        try {
          return JSON.parse(text);
        } catch {
          throw new Error(
            "The node returned script/text instead of JSON."
          );
        }

      } finally {
        clearTimeout(timeout);
      }
    }

    async function loadMemos() {
      const feed = document.getElementById("feed");
      const status = document.getElementById("status");
      const countEl = document.getElementById("count");
      const refreshBtn = document.getElementById("refreshBtn");
      const liveDot = document.getElementById("liveDot");

      status.textContent = "Listening...";
      liveDot.classList.remove("error");
      refreshBtn.disabled = true;

      try {
        const data = await fetchExplorer();

        const transactions =
          findMemoTransactions(data);

        const blocks =
          collectChainBlocks(data);

        const memos = [];

        for (const tx of transactions) {
          const memo = String(
            tx.payload_memo ?? ""
          ).trim();

          if (!memo) {
            continue;
          }

          const sender =
            tx.sender ??
            tx.from ??
            "";

          const recipient =
            tx.recipient ??
            tx.to ??
            "";

          const isReward =
            String(sender) === "NETWORK_REWARD" ||
            memo.toLowerCase().includes("block reward") ||
            memo.toLowerCase().includes("mining reward") ||
            memo.startsWith("Block ");

          if (isReward) {
            continue;
          }

          memos.push({
            height: extractBlockHeight(tx, blocks),

            timestamp:
              tx.timestamp ??
              tx.time ??
              tx.created_at ??
              null,

            from: sender,
            to: recipient,

            amount:
              tx.amount ??
              tx.value ??
              null,

            memo
          });
        }

        /*
         * Remove duplicate transactions in case the recursive
         * parser encountered the same object through multiple paths.
         */
        const unique = [];
        const seen = new Set();

        for (const memo of memos) {
          const key = JSON.stringify([
            memo.height,
            memo.timestamp,
            memo.from,
            memo.to,
            memo.memo
          ]);

          if (!seen.has(key)) {
            seen.add(key);
            unique.push(memo);
          }
        }

        unique.sort(
          (a, b) =>
            Number(b.timestamp || 0) -
            Number(a.timestamp || 0)
        );

        if (unique.length === 0) {
          feed.innerHTML = `
            <div class="empty">
              The chain is connected, but there are
              currently no public whispers to display.
              <br><br>
              Be the first to leave a whisper.
            </div>
          `;

          countEl.textContent = "";
        } else {
          feed.innerHTML = unique
            .map(m => `
              <div class="memo">

                <div class="meta">
                  <span>
                    Block #${escapeHtml(m.height)}
                    · ${formatTime(m.timestamp)}
                  </span>

                  <span class="amount">
                    ${escapeHtml(formatAmount(m.amount))}
                  </span>
                </div>

                <div
                  class="meta"
                  style="margin-bottom: 10px;"
                >
                  <span>
                    ${escapeHtml(shortAddr(m.from))}
                    →
                    ${escapeHtml(shortAddr(m.to))}
                  </span>
                </div>

                <div class="memo-text">
                  ${escapeHtml(m.memo)}
                </div>

              </div>
            `)
            .join("");

          countEl.textContent =
            unique.length + " whispers";
        }

        status.textContent =
          "Connected · Updated " +
          new Date().toLocaleTimeString();

        liveDot.classList.remove("error");

      } catch (error) {
        console.error(
          "NevWhisper connection error:",
          error
        );

        feed.innerHTML = `
          <div class="error-box">

            <strong>
              Failed to hear the chain.
            </strong>

            <br><br>

            ${escapeHtml(error.message)}

            <br><br>

            <a
              href="https://q-lock-ecosystem.com/explorer"
              target="_blank"
              rel="noopener"
            >
              Open the official NEV369 Explorer
            </a>

          </div>
        `;

        status.textContent =
          "Connection error";

        countEl.textContent = "";

        liveDot.classList.add("error");

      } finally {
        refreshBtn.disabled = false;
      }
    }

    function setupAutoRefresh() {
      clearInterval(autoTimer);

      if (
        document.getElementById("autoRefresh").checked
      ) {
        autoTimer = setInterval(
          loadMemos,
          REFRESH_MS
        );
      }
    }

    document
      .getElementById("autoRefresh")
      .addEventListener(
        "change",
        setupAutoRefresh
      );

    loadMemos();
    setupAutoRefresh();
  </script>
</body>
</html>
