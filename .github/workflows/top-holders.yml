name: NEV369 Top Holders Scan

on:
  push:
    branches:
      - main
    paths:
      - "tools/update-top-holders.mjs"
      - ".github/workflows/top-holders.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: nev369-top-holders-scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    name: Catch up and publish Top Holders
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout scanner code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          path: source

      - name: Checkout holder state
        uses: actions/checkout@v4
        with:
          ref: holder-scan-data
          fetch-depth: 1
          path: data

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Incremental NEV369 scan
        env:
          NEV369_NODE: https://q-lock-ecosystem.com/node
          REQUEST_DELAY_MS: "100"
        working-directory: data
        run: node ../source/tools/update-top-holders.mjs

      - name: Publish updated holder state
        working-directory: data
        run: |
          set -euo pipefail
          test -s top-holders.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top-holders.json
          git commit -m "Update NEV369 top holders to latest block" || true
          git push origin holder-scan-data
