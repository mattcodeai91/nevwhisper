    }

<script>
"use strict";


/*
==============================================================
 NEVWHISPER
 NEV369 MEMO CHAT
==============================================================

 ARCHITECTURE

 The scanner maintains ONE continuous frontier:

       Genesis #0
           ↓
           ↓
       #1
           ↓
          ...
           ↓
       current tip

 It NEVER maintains a giant "repair queue".

 Every successfully fetched block advances the frontier.

 Every ~100 blocks we check the live chain tip.

 If the chain has grown:

       old target #5773
       new target #5778

 the scanner simply continues:

       #5774
       #5775
       #5776
       #5777
       #5778

 Already verified blocks are NEVER rescanned.

 STORAGE

 IndexedDB stores:
   - scanner frontier
   - whispers by transaction hash

 SYSTEM MEMOS

 NETWORK_REWARD and
 "Block XXXX reward"
 are excluded from the public feed.

==============================================================
*/


/* ============================================================
   CONFIGURATION
   ============================================================ */

const NODE =
  "https://nevwhisper-proxy.mattcodeai91.workers.dev";

const DB_NAME =
  "nevwhisper-genesis-v1";

const DB_VERSION =
  1;

/*
  The Worker accepts batches of ten blocks.
*/
const BATCH_SIZE =
  10;

/*
  Check the live blockchain tip every 100 verified blocks.
*/
const TIP_CHECK_INTERVAL =
  100;

/*
  Transient Worker/upstream failures are retried.
*/
const MAX_RETRIES =
  4;

const RETRY_DELAY =
  1500;

/*
  After a completed scan, check again periodically.
*/
const AUTO_REFRESH_MS =
  369000;


/* ============================================================
   STATE
   ============================================================ */

const state = {

  /*
    Highest block successfully verified.

    -1 means Genesis has not yet been verified.
  */
  verifiedThrough: -1,

  /*
    Current live blockchain height.
  */
  chainHeight: -1,

  /*
    tx_hash -> whisper
  */
  whispers: new Map(),

  /*
    Prevent overlapping scans.
  */
  scanning: false,

  /*
    Stop request.
  */
  stopRequested: false,

  /*
    Number of blocks processed since last tip check.
  */
  blocksSinceTipCheck: 0
};


/* ============================================================
   DOM
   ============================================================ */

const els = {

  statusDot:
    document.getElementById(
      "statusDot"
    ),

  statusText:
    document.getElementById(
      "statusText"
    ),

  notice:
    document.getElementById(
      "notice"
    ),

  startBtn:
    document.getElementById(
      "startBtn"
    ),

  stopBtn:
    document.getElementById(
      "stopBtn"
    ),

  rebuildBtn:
    document.getElementById(
      "rebuildBtn"
    ),

  searchInput:
    document.getElementById(
      "searchInput"
    ),

  progressLabel:
    document.getElementById(
      "progressLabel"
    ),

  progressPercent:
    document.getElementById(
      "progressPercent"
    ),

  progressBar:
    document.getElementById(
      "progressBar"
    ),

  progressDetail:
    document.getElementById(
      "progressDetail"
    ),

  chainHeight:
    document.getElementById(
      "chainHeight"
    ),

  verifiedThrough:
    document.getElementById(
      "verifiedThrough"
    ),

  whisperCount:
    document.getElementById(
      "whisperCount"
    ),

  blocksRemaining:
    document.getElementById(
      "blocksRemaining"
    ),

  feedCount:
    document.getElementById(
      "feedCount"
    ),

  feed:
    document.getElementById(
      "feed"
    )
};


/* ============================================================
   INDEXEDDB
   ============================================================ */

let dbPromise = null;


function openDatabase() {

  if (dbPromise) {
    return dbPromise;
  }

  dbPromise =
    new Promise(
      (
        resolve,
        reject
      ) => {

        const request =
          indexedDB.open(
            DB_NAME,
            DB_VERSION
          );

        request.onupgradeneeded =
          event => {

            const db =
              event.target.result;

            if (
              !db.objectStoreNames.contains(
                "meta"
              )
            ) {

              db.createObjectStore(
                "meta"
              );
            }

            if (
              !db.objectStoreNames.contains(
                "whispers"
              )
            ) {

              db.createObjectStore(
                "whispers",
                {
                  keyPath: "tx_hash"
                }
              );
            }
          };

        request.onsuccess =
          () => {

            const db =
              request.result;

            db.onversionchange =
              () => db.close();

            resolve(db);
          };

        request.onerror =
          () => {

            reject(
              request.error
            );
          };
      }
    );

  return dbPromise;
}


async function loadDatabase() {

  const db =
    await openDatabase();

  await new Promise(
    (
      resolve,
      reject
    ) => {

      const tx =
        db.transaction(
          [
            "meta",
            "whispers"
          ],
          "readonly"
        );

      const meta =
        tx.objectStore(
          "meta"
        );

      const whispers =
        tx.objectStore(
          "whispers"
        );

      const frontierRequest =
        meta.get(
          "verifiedThrough"
        );

      const whisperRequest =
        whispers.getAll();

      frontierRequest.onsuccess =
        () => {

          const value =
            Number(
              frontierRequest.result
            );

          state.verifiedThrough =
            Number.isFinite(value)
              ? value
              : -1;
        };

      whisperRequest.onsuccess =
        () => {

          state.whispers.clear();

          for (
            const whisper
            of whisperRequest.result
          ) {

            if (
              whisper &&
              whisper.tx_hash
            ) {

              state.whispers.set(
                String(
                  whisper.tx_hash
                ),
                whisper
              );
            }
          }
        };

      tx.oncomplete =
        resolve;

      tx.onerror =
        () => {

          reject(
            tx.error
          );
        };

      tx.onabort =
        () => {

          reject(
            tx.error
          );
        };
    }
  );
}


async function saveFrontier() {

  const db =
    await openDatabase();

  await new Promise(
    (
      resolve,
      reject
    ) => {

      const tx =
        db.transaction(
          "meta",
          "readwrite"
        );

      tx.objectStore(
        "meta"
      ).put(
        state.verifiedThrough,
        "verifiedThrough"
      );

      tx.oncomplete =
        resolve;

      tx.onerror =
        () => {

          reject(
            tx.error
          );
        };
    }
  );
}


async function saveWhispers(
  whispers
) {

  if (
    !whispers.length
  ) {
    return;
  }

  const db =
    await openDatabase();

  await new Promise(
    (
      resolve,
      reject
    ) => {

      const tx =
        db.transaction(
          "whispers",
          "readwrite"
        );

      const store =
        tx.objectStore(
          "whispers"
        );

      for (
        const whisper
        of whispers
      ) {

        if (
          whisper &&
          whisper.tx_hash
        ) {

          store.put(
            whisper
          );
        }
      }

      tx.oncomplete =
        resolve;

      tx.onerror =
        () => {

          reject(
            tx.error
          );
        };
    }
  );
}


async function clearDatabase() {

  const db =
    await openDatabase();

  await new Promise(
    (
      resolve,
      reject
    ) => {

      const tx =
        db.transaction(
          [
            "meta",
            "whispers"
          ],
          "readwrite"
        );

      tx.objectStore(
        "meta"
      ).clear();

      tx.objectStore(
        "whispers"
      ).clear();

      tx.oncomplete =
        resolve;

      tx.onerror =
        () => {

          reject(
            tx.error
          );
        };
    }
  );

  state.verifiedThrough =
    -1;

  state.whispers.clear();
}


/* ============================================================
   NETWORK
   ============================================================ */

async function sleep(
  milliseconds
) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        milliseconds
      )
  );
}


async function getJson(
  path
) {

  let lastError = null;

  for (
    let attempt = 1;
    attempt <= MAX_RETRIES;
    attempt++
  ) {

    if (
      state.stopRequested
    ) {

      throw new Error(
        "SCAN_STOPPED"
      );
    }

    try {

      const response =
        await fetch(
          NODE + path,
          {
            method: "GET",
            cache: "no-store"
          }
        );

      const text =
        await response.text();

      let data;

      try {

        data =
          JSON.parse(
            text
          );

      } catch {

        throw new Error(
          `Invalid JSON returned from ${path}`
        );
      }

      if (
        !response.ok
      ) {

        throw new Error(
          `${response.status}: ${
            data?.error ||
            response.statusText
          }`
        );
      }

      return data;

    } catch (
      error
    ) {

      lastError =
        error;

      if (
        attempt <
        MAX_RETRIES
      ) {

        updateProgress(
          "Retrying network request",
          currentPercent(),
          `Attempt ${attempt + 1} of ${MAX_RETRIES}…`
        );

        await sleep(
          RETRY_DELAY *
          attempt
        );
      }
    }
  }

  throw (
    lastError ||
    new Error(
      "Network request failed"
    )
  );
}


async function getInfo() {

  return await getJson(
    "/info"
  );
}


/* ============================================================
   TIMESTAMP HANDLING
   ============================================================ */

function formatTimestamp(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "Unknown time";
  }

  const n =
    Number(value);

  if (
    !Number.isFinite(n)
  ) {

    const d =
      new Date(
        value
      );

    if (
      Number.isNaN(
        d.getTime()
      )
    ) {

      return "Unknown time";
    }

    return d.toLocaleString();
  }

  let milliseconds;

  /*
    NEV369 currently appears to expose
    Unix timestamps in seconds.

    This also handles:
      milliseconds
      microseconds
      nanoseconds
  */

  if (
    n < 1e12
  ) {

    milliseconds =
      n * 1000;

  } else if (
    n < 1e15
  ) {

    milliseconds =
      n;

  } else if (
    n < 1e18
  ) {

    milliseconds =
      n / 1000;

  } else {

    milliseconds =
      n / 1000000;
  }

  const date =
    new Date(
      milliseconds
    );

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "Unknown time";
  }

  return date.toLocaleString();
}


/* ============================================================
   MEMO FILTERING
   ============================================================ */

function isSystemMemo(
  tx
) {

  const sender =
    String(
      tx?.sender ??
      ""
    )
      .trim()
      .toUpperCase();

  const memo =
    String(
      tx?.payload_memo ??
      tx?.memo ??
      ""
    )
      .trim();

  /*
    Network reward transactions are not public whispers.
  */
  if (
    sender ===
    "NETWORK_REWARD"
  ) {

    return true;
  }

  /*
    Also filter the known reward memo format.
  */
  if (
    /^Block\s+\d+\s+reward$/i.test(
      memo
    )
  ) {

    return true;
  }

  return false;
}


/* ============================================================
   MEMO EXTRACTION
   ============================================================ */

function extractWhispers(
  result
) {

  const output = [];

  const whispers =
    Array.isArray(
      result?.whispers
    )
      ? result.whispers
      : [];

  for (
    const item
    of whispers
  ) {

    if (
      !item
    ) {
      continue;
    }

    const memo =
      String(
        item.memo ??
        item.payload_memo ??
        ""
      ).trim();

    const hash =
      String(
        item.tx_hash ??
        item.hash ??
        ""
      ).trim();

    if (
      !memo ||
      !hash
    ) {
      continue;
    }

    /*
      Defensive reward filtering.
    */
    const sender =
      String(
        item.sender ??
        ""
      )
        .trim()
        .toUpperCase();

    if (
      sender ===
      "NETWORK_REWARD"
    ) {
      continue;
    }

    if (
      /^Block\s+\d+\s+reward$/i.test(
        memo
      )
    ) {
      continue;
    }

    /*
      IMPORTANT:
      The Worker already supplies the actual blockchain block.
      We preserve it exactly.
    */
    const block =
      Number(
        item.block
      );

    output.push({

      block:
        Number.isFinite(block)
          ? block
          : null,

      timestamp:
        item.timestamp ??
        null,

      tx_hash:
        hash,

      sender:
        item.sender ??
        "",

      recipient:
        item.recipient ??
        "",

      amount:
        item.amount ??
        0,

      fee:
        item.fee ??
        0,

      memo:
        memo
    });
  }

  return output;
}


/* ============================================================
   MERGE / DEDUPLICATION
   ============================================================ */

function mergeWhispers(
  whispers
) {

  const changed = [];

  for (
    const whisper
    of whispers
  ) {

    if (
      !whisper ||
      !whisper.tx_hash
    ) {
      continue;
    }

    const hash =
      String(
        whisper.tx_hash
      );

    const existing =
      state.whispers.get(
        hash
      );

    if (!existing) {

      state.whispers.set(
        hash,
        {
          ...whisper,
          tx_hash: hash
        }
      );

      changed.push(
        state.whispers.get(
          hash
        )
      );

      continue;
    }

    /*
      Keep the authoritative block and other
      information if a duplicate is encountered.
    */

    const merged = {
      ...existing,
      ...whisper,
      tx_hash: hash
    };

    state.whispers.set(
      hash,
      merged
    );

    /*
      Saving duplicates is harmless because
      IndexedDB uses tx_hash as the primary key.
    */
    changed.push(
      merged
    );
  }

  return changed;
}


/* ============================================================
   BATCH SCANNING
   ============================================================ */

/*
  The blockchain is scanned FORWARD.

  Our frontend range is:

      start = 0
      end   = 9

  But the Worker API expects:

      from = 9
      to   = 0

  So we convert the range here.
*/

async function scanBatch(
  startHeight,
  endHeight
) {

  if (
    state.stopRequested
  ) {

    throw new Error(
      "SCAN_STOPPED"
    );
  }

  const from =
    Number(
      endHeight
    );

  const to =
    Number(
      startHeight
    );

  const result =
    await getJson(
      `/whispers?from=${from}&to=${to}`
    );

  if (
    state.stopRequested
  ) {

    throw new Error(
      "SCAN_STOPPED"
    );
  }

  /*
    Worker errors identify individual blocks
    that were NOT successfully fetched.

    A batch containing ANY failed block cannot
    advance our continuous frontier.
  */
  const errors =
    Array.isArray(
      result?.errors
    )
      ? result.errors
      : [];

  if (
    errors.length > 0
  ) {

    const failedHeights =
      errors
        .map(
          error =>
            Number(
              error.height
            )
        )
        .filter(
          Number.isFinite
        );

    throw new Error(
      `Batch ${startHeight}-${endHeight} had failed block(s): ${
        failedHeights.join(", ")
      }`
    );
  }

  const whispers =
    extractWhispers(
      result
    );

  const changed =
    mergeWhispers(
      whispers
    );

  /*
    Only now is the entire batch considered
    verified.
  */
  state.verifiedThrough =
    endHeight;

  state.blocksSinceTipCheck +=
    (
      endHeight -
      startHeight +
      1
    );

  /*
    Persist the actual frontier.
  */
  await saveFrontier();

  if (
    changed.length
  ) {

    await saveWhispers(
      changed
    );
  }

  return {
    start:
      startHeight,

    end:
      endHeight,

    whispers:
      changed.length
  };
}


/* ============================================================
   LIVE TIP CHECK
   ============================================================ */

async function refreshChainTip() {

  const info =
    await getInfo();

  const height =
    Number(
      info.height ??
      info.chain_height
    );

  if (
    !Number.isFinite(
      height
    )
  ) {

    throw new Error(
      "NEV369 node returned an invalid chain height."
    );
  }

  state.chainHeight =
    Math.floor(
      height
    );

  state.blocksSinceTipCheck =
    0;

  updateStats();

  return state.chainHeight;
}


/* ============================================================
   PROGRESS
   ============================================================ */

function currentPercent() {

  if (
    state.chainHeight < 0
  ) {
    return 0;
  }

  if (
    state.verifiedThrough < 0
  ) {
    return 0;
  }

  if (
    state.verifiedThrough >=
    state.chainHeight
  ) {
    return 100;
  }

  return (
    (
      state.verifiedThrough + 1
    ) /
    (
      state.chainHeight + 1
    )
  ) * 100;
}


function updateProgress(
  label,
  percent,
  detail
) {

  const safe =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent) || 0
      )
    );

  els.progressLabel.textContent =
    label;

  els.progressPercent.textContent =
    `${Math.round(safe)}%`;

  els.progressBar.style.width =
    `${safe}%`;

  els.progressDetail.textContent =
    detail;
}


/* ============================================================
   UI
   ============================================================ */

function setStatus(
  online,
  message
) {

  els.statusText.textContent =
    message;

  if (
    online
  ) {

    els.statusDot.classList.remove(
      "offline"
    );

  } else {

    els.statusDot.classList.add(
      "offline"
    );
  }
}


function updateStats() {

  els.chainHeight.textContent =
    state.chainHeight >= 0
      ? `#${state.chainHeight}`
      : "—";

  els.verifiedThrough.textContent =
    state.verifiedThrough >= 0
      ? `#${state.verifiedThrough}`
      : "—";

  els.whisperCount.textContent =
    state.whispers.size.toLocaleString();

  const remaining =
    state.chainHeight >= 0
      ? Math.max(
          0,
          state.chainHeight -
          state.verifiedThrough
        )
      : 0;

  els.blocksRemaining.textContent =
    state.chainHeight >= 0
      ? remaining.toLocaleString()
      : "—";

  renderFeed();
}


function renderFeed() {

  const query =
    els.searchInput.value
      .trim()
      .toLowerCase();

  let items =
    Array.from(
      state.whispers.values()
    );

  items.sort(
    (
      a,
      b
    ) => {

      const blockDifference =
        Number(
          b.block || 0
        ) -
        Number(
          a.block || 0
        );

      if (
        blockDifference !== 0
      ) {

        return blockDifference;
      }

      return String(
        b.tx_hash || ""
      ).localeCompare(
        String(
          a.tx_hash || ""
        )
      );
    }
  );

  if (
    query
  ) {

    items =
      items.filter(
        whisper => {

          const searchable =
            [
              whisper.memo,
              whisper.tx_hash,
              whisper.sender,
              whisper.recipient,
              whisper.block
            ]
              .join(" ")
              .toLowerCase();

          return searchable.includes(
            query
          );
        }
      );
  }

  els.feedCount.textContent =
    `${items.length.toLocaleString()} whisper${
      items.length === 1
        ? ""
        : "s"
    }`;

  if (
    !items.length
  ) {

    els.feed.innerHTML = `
      <div class="empty">
        ${
          query
            ? "No whispers match your search."
            : "No public whispers loaded yet."
        }
      </div>
    `;

    return;
  }

  const fragment =
    document.createDocumentFragment();

  /*
    Keep rendering sane even if the chain eventually
    contains a very large number of whispers.
  */
  const visible =
    items.slice(
      0,
      500
    );

  for (
    const whisper
    of visible
  ) {

    const card =
      document.createElement(
        "article"
      );

    card.className =
      "card";

    const block =
      Number(
        whisper.block
      );

    const tx =
      String(
        whisper.tx_hash ||
        ""
      );

    const sender =
      String(
        whisper.sender ||
        ""
      );

    const recipient =
      String(
        whisper.recipient ||
        ""
      );

    const amount =
      Number(
        whisper.amount
      );

    const amountText =
      Number.isFinite(
        amount
      )
        ? `${amount} NEV`
        : String(
            whisper.amount ??
            ""
          );

    card.innerHTML = `

      <div class="card-top">

        <div class="block">
          #${
            Number.isFinite(
              block
            )
              ? block
              : "?"
          }
        </div>

        <div class="time">
          ${escapeHtml(
            formatTimestamp(
              whisper.timestamp
            )
          )}
        </div>

      </div>

      <div class="memo">
        ${escapeHtml(
          whisper.memo ||
          ""
        )}
      </div>

      <div class="meta">

        <div>
          <strong>TX</strong>
          <span class="hash">
            ${escapeHtml(
              tx
            )}
          </span>
        </div>

        <div>
          <strong>From:</strong>
          <span class="hash">
            ${escapeHtml(
              sender
            )}
          </span>
        </div>

        <div>
          <strong>To:</strong>
          <span class="hash">
            ${escapeHtml(
              recipient
            )}
          </span>
        </div>

        <div>
          <strong>Amount:</strong>
          ${escapeHtml(
            amountText
          )}
        </div>

      </div>
    `;

    fragment.appendChild(
      card
    );
  }

  els.feed.innerHTML = "";

  els.feed.appendChild(
    fragment
  );
}


function escapeHtml(
  value
) {

  return String(
    value
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


function showNotice(
  message
) {

  els.notice.textContent =
    message;

  els.notice.classList.add(
    "show"
  );
}


function hideNotice() {

  els.notice.classList.remove(
    "show"
  );
}


function setScanningUi(
  scanning
) {

  els.startBtn.disabled =
    scanning;

  els.stopBtn.disabled =
    !scanning;

  els.rebuildBtn.disabled =
    scanning;
}


/* ============================================================
   THE CORE GENESIS → TIP SCANNER
   ============================================================ */

async function startScan() {

  if (
    state.scanning
  ) {
    return;
  }

  state.scanning =
    true;

  state.stopRequested =
    false;

  setScanningUi(
    true
  );

  hideNotice();

  try {

    setStatus(
      true,
      "Connected · NEV369"
    );

    /*
      Get the live tip before doing anything.
    */
    updateProgress(
      "Reading current chain",
      currentPercent(),
      "Getting the latest NEV369 block height…"
    );

    await refreshChainTip();

    /*
      ========================================================
      CONTINUOUS GENESIS → TIP LOOP
      ========================================================
    */

    while (
      !state.stopRequested
    ) {

      /*
        If we've reached the known tip, check whether
        the blockchain has grown.
      */
      if (
        state.verifiedThrough >=
        state.chainHeight
      ) {

        updateProgress(
          "Checking latest block",
          100,
          `Verified through #${state.verifiedThrough}. Checking whether a new block has arrived…`
        );

        const previousTip =
          state.chainHeight;

        await refreshChainTip();

        if (
          state.chainHeight <=
          previousTip
        ) {

          /*
            We are completely current.
          */

          updateProgress(
            "Chain current",
            100,
            `Genesis #0 through #${state.verifiedThrough} verified. Waiting for the next NEV369 block…`
          );

          updateStats();

          break;
        }

        /*
          Chain grew.
          The loop continues naturally into the new blocks.
        */

        continue;
      }


      /*
        ======================================================
        CHECKPOINT TIP
        ======================================================
      */

      if (
        state.blocksSinceTipCheck >=
        TIP_CHECK_INTERVAL
      ) {

        const oldTip =
          state.chainHeight;

        updateProgress(
          "Checking latest block",
          currentPercent(),
          `Verified through #${state.verifiedThrough}. Checking the live chain tip…`
        );

        await refreshChainTip();

        if (
          state.chainHeight >
          oldTip
        ) {

          updateProgress(
            "New blocks detected",
            currentPercent(),
            `Chain advanced from #${oldTip} to #${state.chainHeight}. Continuing forward.`
          );
        }
      }


      /*
        ======================================================
        DETERMINE NEXT BATCH
        ======================================================
      */

      const start =
        state.verifiedThrough + 1;

      const end =
        Math.min(
          start +
          BATCH_SIZE -
          1,
          state.chainHeight
        );

      /*
        This is the key:

        We ALWAYS scan exactly the next contiguous
        batch.

        No jumping.
        No repair queue.
        No rescanning old blocks.
      */

      updateProgress(
        "Scanning Genesis → current",
        currentPercent(),
        `Scanning blocks #${start} → #${end}`
      );


      /*
        ======================================================
        SCAN BATCH
        ======================================================
      */

      try {

        const result =
          await scanBatch(
            start,
            end
          );

        /*
          Show discovery immediately.
        */
        if (
          result.whispers > 0
        ) {

          updateProgress(
            "Whisper discovered",
            currentPercent(),
            `${result.whispers} new public whisper(s) found in #${start} → #${end}`
          );

        } else {

          updateProgress(
            "Scanning Genesis → current",
            currentPercent(),
            `Verified #${start} → #${end}`
          );
        }

        updateStats();

      } catch (
        error
      ) {

        if (
          String(
            error?.message
          ) ===
          "SCAN_STOPPED"
        ) {

          throw error;
        }

        /*
          IMPORTANT:

          The frontier does NOT move.

          Therefore the failed batch will simply be
          retried on the next loop.

          This prevents gaps.
        */

        console.warn(
          "Batch failed:",
          start,
          end,
          error
        );

        updateProgress(
          "Retrying block batch",
          currentPercent(),
          `Could not verify #${start} → #${end}. The frontier remains at #${state.verifiedThrough}. Retrying…`
        );

        await sleep(
          RETRY_DELAY
        );
      }
    }


    /*
      ========================================================
      STOPPED
      ========================================================
    */

    if (
      state.stopRequested
    ) {

      updateProgress(
        "Scan stopped",
        currentPercent(),
        `Saved through #${state.verifiedThrough}. Click Start Scan to continue from exactly where it stopped.`
      );

      return;
    }


    /*
      ========================================================
      CURRENT
      ========================================================
    */

    updateStats();

    updateProgress(
      "Chain current",
      100,
      `Genesis #0 through #${state.verifiedThrough} verified. Waiting for the next block.`
    );

    setStatus(
      true,
      "Connected · NEV369"
    );

  } catch (
    error
  ) {

    if (
      String(
        error?.message
      ) ===
      "SCAN_STOPPED"
    ) {

      updateProgress(
        "Scan stopped",
        currentPercent(),
        `Saved through #${state.verifiedThrough}. Click Start Scan to continue.`
      );

    } else {

      console.error(
        "NevWhisper scan error:",
        error
      );

      setStatus(
        false,
        "Connection problem"
      );

      updateProgress(
        "Scan paused",
        currentPercent(),
        String(
          error?.message ||
          error
        )
      );

      showNotice(
        "The scanner encountered a network problem. Your verified frontier is safe. Start Scan will continue from the last successfully verified block."
      );
    }

  } finally {

    state.scanning =
      false;

    state.stopRequested =
      false;

    setScanningUi(
      false
    );

    updateStats();
  }
}


/* ============================================================
   STOP SCAN
   ============================================================ */

function stopScan() {

  if (
    !state.scanning
  ) {
    return;
  }

  state.stopRequested =
    true;

  els.stopBtn.disabled =
    true;

  updateProgress(
    "Stopping scan…",
    currentPercent(),
    "The current request will finish, then the scanner will stop safely."
  );
}


/* ============================================================
   REBUILD FROM GENESIS
   ============================================================ */

async function rebuildFromGenesis() {

  if (
    state.scanning
  ) {
    return;
  }

  const confirmed =
    window.confirm(
      "Rebuild the NevWhisper index from Genesis?\n\nThis clears only the local browser index. It does NOT affect the NEV369 blockchain or any transactions."
    );

  if (
    !confirmed
  ) {
    return;
  }

  try {

    await clearDatabase();

    state.chainHeight =
      -1;

    state.verifiedThrough =
      -1;

    state.blocksSinceTipCheck =
      0;

    updateStats();

    updateProgress(
      "Ready for Genesis",
      0,
      "Local index cleared. The next scan will begin at block #0."
    );

    await startScan();

  } catch (
    error
  ) {

    console.error(
      "Genesis rebuild failed:",
      error
    );

    showNotice(
      `Could not rebuild the local index: ${error}`
    );
  }
}


/* ============================================================
   EVENTS
   ============================================================ */

els.startBtn.addEventListener(
  "click",
  startScan
);

els.stopBtn.addEventListener(
  "click",
  stopScan
);

els.rebuildBtn.addEventListener(
  "click",
  rebuildFromGenesis
);

els.searchInput.addEventListener(
  "input",
  renderFeed
);


/* ============================================================
   AUTOMATIC FUTURE CHECK
   ============================================================ */

/*
  IMPORTANT:

  The page does NOT automatically start a huge scan on reload.

  If the scanner is idle, this timer will check again after
  369 seconds.

  Because the frontier is persisted in IndexedDB, it resumes
  exactly where it left off.
*/

setInterval(
  () => {

    if (
      !state.scanning
    ) {

      startScan();
    }

  },
  AUTO_REFRESH_MS
);


/* ============================================================
   INITIALIZATION
   ============================================================ */

(async function init() {

  try {

    await loadDatabase();

    updateStats();

    setStatus(
      true,
      "Ready · NEV369"
    );

    if (
      state.verifiedThrough >= 0
    ) {

      updateProgress(
        "Ready to continue",
        currentPercent(),
        `Local index is verified through #${state.verifiedThrough}. Click Start Scan to continue toward the current chain tip.`
      );

    } else {

      updateProgress(
        "Ready for Genesis",
        0,
        "No chain index exists yet. Click Start Scan to begin at block #0."
      );
    }

  } catch (
    error
  ) {

    console.error(
      "IndexedDB initialization failed:",
      error
    );

    setStatus(
      false,
      "Local database unavailable"
    );

    showNotice(
      "NevWhisper could not open its local IndexedDB database. Check that browser storage is enabled."
    );
  }

})();
</script>
