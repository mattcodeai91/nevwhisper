<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NevWhisper — NEV369 Memo Chat</title>

  <style>
    :root {
      --bg: #090d12;
      --panel: #111821;
      --panel-hover: #151f2a;
      --border: #253241;
      --text: #edf3f8;
      --muted: #8997a6;
      --accent: #67d5ff;
      --accent-dark: #075985;
      --green: #86efac;
      --red: #fca5a5;
      --yellow: #fde68a;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(1050px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    .header {
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #0284c7,
          #2563eb
        );

      color: white;
      font-size: 16px;
      font-weight: 900;

      box-shadow:
        0 8px 25px rgba(14, 165, 233, 0.2);
    }

    .title {
      margin: 0;
      font-size: 25px;
      line-height: 1.1;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================================================
       CONTROLS
       ========================================================= */

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 16px;
    }

    button {
      padding: 9px 14px;

      border-radius: 9px;
      border: 1px solid var(--border);

      background: #141d27;
      color: var(--text);

      font-size: 13px;
      font-weight: 800;

      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #1a2632;
      border-color: #3b4d61;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.primary {
      background: #075985;
      border-color: #0ea5e9;
    }

    button.primary:hover:not(:disabled) {
      background: #0369a1;
    }

    button.stop {
      color: var(--red);
      border-color: #6f1d1d;
    }

    button.stop:hover:not(:disabled) {
      background: #251113;
    }

    /* =========================================================
       STATUS
       ========================================================= */

    .status {
      padding: 15px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;

      margin-bottom: 14px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;

      gap: 15px;

      margin-bottom: 11px;
    }

    .status-title {
      font-size: 14px;
      font-weight: 800;
    }

    .status-detail {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-pill {
      flex-shrink: 0;

      padding: 5px 9px;

      border-radius: 999px;

      background: #18222d;
      border: 1px solid var(--border);

      color: var(--muted);

      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.06em;
    }

    .status-pill.running {
      color: var(--accent);
      background: #082f49;
      border-color: #075985;
    }

    .status-pill.current {
      color: var(--green);
      background: #052e16;
      border-color: #166534;
    }

    .status-pill.error {
      color: var(--red);
      background: #2a0d0d;
      border-color: #7f1d1d;
    }

    .progress-track {
      width: 100%;
      height: 7px;

      overflow: hidden;

      background: #070b10;
      border-radius: 999px;

      border: 1px solid #18232f;
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          #0ea5e9,
          #6366f1
        );

      transition: width 0.25s ease;
    }

    .error {
      display: none;

      margin-top: 10px;
      padding: 9px 10px;

      background: #250d0d;
      border: 1px solid #6f1d1d;
      border-radius: 8px;

      color: var(--red);

      font-size: 12px;

      overflow-wrap: anywhere;
    }

    /* =========================================================
       STATS
       ========================================================= */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 9px;

      margin-bottom: 22px;
    }

    .stat {
      padding: 12px 13px;

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .stat-label {
      margin-bottom: 4px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 900;
    }

    /* =========================================================
       FEED HEADER
       ========================================================= */

    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 10px;
    }

    .feed-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .feed-title h2 {
      margin: 0;

      font-size: 18px;
    }

    .feed-count {
      color: var(--muted);
      font-size: 12px;
    }

    .search {
      width: 250px;
      max-width: 100%;

      padding: 8px 10px;

      background: var(--panel);

      border: 1px solid var(--border);
      border-radius: 8px;

      color: var(--text);

      outline: none;

      font-size: 12px;
    }

    .search:focus {
      border-color: var(--accent);
    }

    /* =========================================================
       WHISPER FEED
       ========================================================= */

    .feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .whisper {
      padding: 13px 15px;

      background: var(--panel);

      border: 1px solid var(--border);
      border-radius: 10px;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .whisper:hover {
      background: var(--panel-hover);
      border-color: #35475a;
    }

    /* ---------------------------------------------------------
       TOP LINE
       --------------------------------------------------------- */

    .whisper-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 8px;
    }

    .block-number {
      color: var(--accent);

      font-size: 13px;
      font-weight: 900;
    }

    .timestamp {
      color: var(--muted);

      font-size: 11px;

      text-align: right;
      white-space: nowrap;
    }

    /* ---------------------------------------------------------
       MEMO
       --------------------------------------------------------- */

    .memo {
      margin-bottom: 11px;

      color: var(--text);

      font-size: 14px;
      line-height: 1.45;

      font-weight: 600;

      overflow-wrap: anywhere;
    }

    /* ---------------------------------------------------------
       DETAILS
       --------------------------------------------------------- */

    .details {
      display: grid;

      grid-template-columns:
        62px
        minmax(0, 1fr);

      column-gap: 12px;
      row-gap: 6px;

      font-size: 11px;
    }

    .label {
      color: var(--muted);
      font-weight: 800;
    }

    .value {
      min-width: 0;
      overflow: hidden;
    }

    .amount {
      color: var(--green);
      font-weight: 900;
    }

    .mono {
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    }

    /* ---------------------------------------------------------
       SHORT LINKS
       --------------------------------------------------------- */

    .compact-link {
      display: inline-flex;

      align-items: center;

      max-width: 100%;

      gap: 4px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

      font-size: 11px;
    }

    .short-text {
      display: block;

      max-width: 100%;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .external {
      flex-shrink: 0;

      color: var(--accent);

      font-family: inherit;

      font-size: 10px;
    }

    /* ---------------------------------------------------------
       EMPTY
       --------------------------------------------------------- */

    .empty {
      padding: 30px 15px;

      background: var(--panel);

      border: 1px dashed var(--border);
      border-radius: 10px;

      color: var(--muted);

      text-align: center;

      font-size: 13px;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {
      margin-top: 25px;

      color: #5f6d7c;

      text-align: center;

      font-size: 10px;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      .stats {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .feed-header {
        align-items: stretch;
        flex-direction: column;
      }

      .search {
        width: 100%;
      }
    }

    @media (max-width: 500px) {

      .container {
        width: calc(100% - 16px);
        padding-top: 18px;
      }

      .title {
        font-size: 21px;
      }

      .whisper {
        padding: 11px 12px;
      }

      .whisper-top {
        align-items: flex-start;
      }

      .timestamp {
        white-space: normal;
      }

      .details {
        grid-template-columns:
          55px
          minmax(0, 1fr);

        column-gap: 9px;
      }

      .controls button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- =====================================================
         HEADER
         ====================================================== -->

    <header class="header">

      <div class="brand">

        <div class="logo">
          NW
        </div>

        <div>

          <h1 class="title">
            NevWhisper
          </h1>

          <div class="subtitle">
            NEV369 Memo Chat — public on-chain whispers
          </div>

        </div>

      </div>

    </header>


    <!-- =====================================================

         ====================================================== -->

    <section class="controls">

      <button
        id="startBtn"

      </button>

        onclick="rebuildFromGenesis()"
      >
        Rebuild From Genesis
      </button>

    </section>


    <!-- =====================================================

         ====================================================== -->

    <section class="status">

      <div class="status-row">

        <div>

          <div
            id="statusTitle"

          >

          </div>

          <div
            id="statusDetail"

        </div>

        <div
          id="statusPill"

        </div>

        ></div>

      </div>

        id="errorBox"

      ></div>

    </section>


    <!-- =====================================================
         STATS
         ====================================================== -->

    <section class="stats">

      <div class="stat">

        <div class="stat-label">
          Chain Height
        </div>

        <div
          id="chainHeight"
          class="stat-value"
        >
          —
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">

        </div>

        <div
          id="verifiedThrough"
          class="stat-value"

      <div class="stat">

      </div>

        <div

    <!-- =====================================================
         WHISPER HEADER
         ====================================================== -->

    <section class="feed-header">

      <div class="feed-title">

        <h2>
          Whispers
        </h2>

        <span
          id="feedCount"
          class="feed-count"

          0 whispers
        </span>

      <input
        id="searchInput"

    <!-- =====================================================

         ====================================================== -->

    <section
      id="feed"

        No whispers loaded yet.
      </div>

    </section>


    <div class="footer">
      NEV369 · Genesis-to-tip verification · Public memo explorer
    </div>

  </main>


  <script>

    /*
    ============================================================
    NEVWHISPER
    ============================================================

    Genesis → current scanner

    IMPORTANT:
    - Uses IndexedDB
    - Does NOT use localStorage
    - Verifies blocks continuously
    - Does not skip failed batches
    - Filters network reward memos
    - Checks live chain tip periodically
    ============================================================
    */


    const NODE =
      "https://nevwhisper-proxy.mattcodeai91.workers.dev";


    const DB_NAME =
      "nevwhisper-genesis-v1";


    const DB_VERSION =
      1;


    const BATCH_SIZE =
      10;


    const TIP_CHECK_INTERVAL =
      100;


    const MAX_RETRIES =
      4;


    const RETRY_DELAY =
      1500;


    const AUTO_REFRESH_MS =
      369000;


    /*
    ============================================================
    STATE
    ============================================================
    */

    const state = {

      verifiedThrough: -1,

      chainHeight: -1,

      whispers: new Map(),

      scanning: false,

      stopRequested: false,

      blocksSinceTipCheck: 0

    };


    let db = null;


    /*
    ============================================================
    INDEXED DB
    ============================================================
    */

    function openDatabase() {

      return new Promise(
        (resolve, reject) => {

          const request =
            indexedDB.open(
              DB_NAME,
              DB_VERSION
            );


          request.onupgradeneeded =
            event => {

              const database =
                event.target.result;


              if (
                !database.objectStoreNames.contains(
                  "meta"
                )
              ) {

                database.createObjectStore(
                  "meta"
                );

              }


              if (
                !database.objectStoreNames.contains(
                  "whispers"
                )
              ) {

                database.createObjectStore(
                  "whispers",
                  {
                    keyPath: "tx_hash"
                  }
                );

              }

            };


          request.onsuccess =
            event => {

              db =
                event.target.result;

              resolve(db);

            };


          request.onerror =
            () => {

              reject(
                request.error ||
                new Error(
                  "Could not open IndexedDB."
                )
              );

            };

        }
      );

    }


    function dbGet(
      storeName,
      key
    ) {

      return new Promise(
        (resolve, reject) => {

          const tx =
            db.transaction(
              storeName,
              "readonly"
            );


          const store =
            tx.objectStore(
              storeName
            );


          const request =
            store.get(key);


          request.onsuccess =
            () => {

              resolve(
                request.result
              );

            };


          request.onerror =
            () => {

              reject(
                request.error
              );

            };

        }
      );

    }


    function dbPut(
      storeName,
      value,
      key
    ) {

      return new Promise(
        (resolve, reject) => {

          const tx =
            db.transaction(
              storeName,
              "readwrite"
            );


          const store =
            tx.objectStore(
              storeName
            );


          const request =
            key === undefined
              ? store.put(value)
              : store.put(value, key);


          request.onsuccess =
            () => resolve();


          request.onerror =
            () =>
              reject(
                request.error
              );

        }
      );

    }


    function dbClear(
      storeName
    ) {

      return new Promise(
        (resolve, reject) => {

          const tx =
            db.transaction(
              storeName,
              "readwrite"
            );


          const request =
            tx.objectStore(
              storeName
            ).clear();


          request.onsuccess =
            () => resolve();


          request.onerror =
            () =>
              reject(
                request.error
              );

        }
      );

    }


    async function saveState() {

      await dbPut(
        "meta",
        state.verifiedThrough,
        "verifiedThrough"
      );


      await dbPut(
        "meta",
        state.chainHeight,
        "chainHeight"
      );

    }


    async function loadState() {

      const verified =
        await dbGet(
          "meta",
          "verifiedThrough"
        );


      const height =
        await dbGet(
          "meta",
          "chainHeight"
        );


      if (
        typeof verified ===
        "number"
      ) {

        state.verifiedThrough =
          verified;

      }


      if (
        typeof height ===
        "number"
      ) {

        state.chainHeight =
          height;

      }

    }


    async function loadWhispers() {

      return new Promise(
        (resolve, reject) => {

          const tx =
            db.transaction(
              "whispers",
              "readonly"
            );


          const store =
            tx.objectStore(
              "whispers"
            );


          const request =
            store.openCursor();


          request.onsuccess =
            event => {

              const cursor =
                event.target.result;


              if (!cursor) {

                resolve();

                return;

              }


              const item =
                cursor.value;


              if (
                item &&
                item.tx_hash
              ) {

                state.whispers.set(
                  item.tx_hash,
                  item
                );

              }


              cursor.continue();

            };


          request.onerror =
            () =>
              reject(
                request.error
              );

        }
      );

    }


    /*
    ============================================================
    NETWORK
    ============================================================
    */

    async function getJson(
      path,
      attempt = 0
    ) {

      const url =
        NODE.replace(
          /\/$/,
          ""
        ) + path;


      try {

        const response =
          await fetch(
            url,
            {
              method: "GET",

              headers: {
                Accept:
                  "application/json"
              },

              cache:
                "no-store"
            }
          );


        const text =
          await response.text();


        let data;


        try {

          data =
            JSON.parse(text);

        } catch {

          throw new Error(
            "Invalid JSON response."
          );

        }


        if (
          !response.ok
        ) {

          throw new Error(
            `${response.status}: ${
              data.error ||
              data.details ||
              response.statusText
            }`
          );

        }


        return data;

      } catch (error) {

        if (
          attempt <
          MAX_RETRIES - 1
        ) {

          const delay =
            RETRY_DELAY *
            (attempt + 1);


          setStatus(
            "Retrying request...",
            `${error.message} · retry ${
              attempt + 2
            }/${MAX_RETRIES}`,
            "error"
          );


          await sleep(
            delay
          );


          return getJson(
            path,
            attempt + 1
          );

        }


        throw error;

      }

    }


    async function getInfo() {

      return await getJson(
        "/info"
      );

    }


    /*
    ============================================================
    UTILITIES
    ============================================================
    */

    function sleep(ms) {

      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            ms
          )
      );

    }


    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    function shortHash(
      value,
      first = 10,
      last = 8
    ) {

      const text =
        String(
          value || ""
        );


      if (
        text.length <=
        first + last + 3
      ) {

        return text;

      }


      return (
        text.slice(
          0,
          first
        ) +
        "..." +
        text.slice(
          -last
        )
      );

    }


    /*
    ============================================================
    TIMESTAMP
    ============================================================
    */

    function formatTimestamp(
      value
    ) {

      if (
        value === null ||
        value === undefined ||
        value === ""
      ) {

        return "Unknown time";

      }


      const n =
        Number(value);


      if (
        !Number.isFinite(n)
      ) {

        const date =
          new Date(value);


        return Number.isNaN(
          date.getTime()
        )
          ? "Unknown time"
          : date.toLocaleString();

      }


      let milliseconds;


      if (
        n < 1e12
      ) {

        milliseconds =
          n * 1000;

      } else if (
        n < 1e15
      ) {

        milliseconds =
          n;

      } else if (
        n < 1e18
      ) {

        milliseconds =
          n / 1000;

      } else {

        milliseconds =
          n / 1000000;

      }


      const date =
        new Date(
          milliseconds
        );


      return Number.isNaN(
        date.getTime()
      )
        ? "Unknown time"
        : date.toLocaleString();

    }


    /*
    ============================================================
    AMOUNT
    ============================================================

    NEV369 has 8 decimals.

    Example:

    1000000000000000 base units
    =
    10,000,000 NEV
    ============================================================
    */

    function formatAmount(
      value
    ) {

      const n =
        Number(value);


      if (
        !Number.isFinite(n)
      ) {

        return escapeHtml(
          value ?? "0"
        );

      }


      const nev =
        n / 100000000;


      return (
        new Intl.NumberFormat(
          undefined,
          {
            maximumFractionDigits:
              8
          }
        ).format(
          nev
        ) +
        " NEV"
      );

    }


    /*
    ============================================================
    REWARD FILTER
    ============================================================
    */

    function isReward(
      item
    ) {

      const sender =
        String(
          item.sender || ""
        )
          .trim()
          .toUpperCase();


      const memo =
        String(
          item.memo || ""
        )
          .trim();


      if (
        sender ===
        "NETWORK_REWARD"
      ) {

        return true;

      }


      if (
        /^Block\s+\d+\s+reward$/i
          .test(memo)
      ) {

        return true;

      }


      return false;

    }


    /*
    ============================================================
    EXPLORER LINKS
    ============================================================
    */

    function txUrl(
      txHash
    ) {

      return (
        "https://q-lock-ecosystem.com/explorer/#/tx/" +
        encodeURIComponent(
          txHash
        )
      );

    }


    function addressUrl(
      address
    ) {

      return (
        "https://q-lock-ecosystem.com/explorer/#/address/" +
        encodeURIComponent(
          address
        )
      );

    }


    /*
    ============================================================
    EXTRACT WHISPERS
    ============================================================
    */

    function extractWhispers(
      result
    ) {

      const source =
        Array.isArray(
          result?.whispers
        )
          ? result.whispers
          : [];


      const output = [];


      for (
        const item of source
      ) {

        if (!item) {

          continue;

        }


        const memo =
          String(
            item.memo || ""
          ).trim();


        const txHash =
          String(
            item.tx_hash || ""
          ).trim();


        if (
          !memo ||
          !txHash
        ) {

          continue;

        }


        if (
          isReward(item)
        ) {

          continue;

        }


        output.push({

          block:
            Number(
              item.block ?? 0
            ),

          timestamp:
            item.timestamp ??
            null,

          tx_hash:
            txHash,

          sender:
            String(
              item.sender || ""
            ),

          recipient:
            String(
              item.recipient || ""
            ),

          amount:
            item.amount ??
            0,

          fee:
            item.fee ??
            0,

          memo

        });

      }


      return output;

    }


    async function mergeWhispers(
      items
    ) {

      for (
        const item of items
      ) {

        state.whispers.set(
          item.tx_hash,
          item
        );


        await dbPut(
          "whispers",
          item
        );

      }

    }


    /*
    ============================================================
    SCAN ONE CONTIGUOUS BATCH
    ============================================================
    */

    async function scanBatch(
      startHeight,
      endHeight
    ) {

      /*
        Worker expects:

        from = highest block
        to   = lowest block

        Example:

        frontend:
        #0 → #9

        Worker:
        from=9&to=0
      */


      const result =
        await getJson(
          `/whispers?from=${endHeight}&to=${startHeight}`
        );


      if (
        Array.isArray(
          result.errors
        ) &&
        result.errors.length > 0
      ) {

        const first =
          result.errors[0];


        throw new Error(
          `Block ${first.height}: ${first.error}`
        );

      }


      const whispers =
        extractWhispers(
          result
        );


      await mergeWhispers(
        whispers
      );


      /*
        ONLY after every requested block
        succeeded do we move the checkpoint.
      */

      state.verifiedThrough =
        endHeight;


      state.blocksSinceTipCheck +=
        endHeight -
        startHeight +
        1;


      await saveState();

      render();

    }


    /*
    ============================================================
    START SCAN
    ============================================================
    */

    async function startScan() {

      if (
        state.scanning
      ) {

        return;

      }


      state.scanning =
        true;


      state.stopRequested =
        false;


      updateButtons();

      hideError();


      try {

        let info =
          await getInfo();


        let chainHeight =
          Number(
            info.height ??
            info.chain_height ??
            0
          );


        state.chainHeight =
          chainHeight;


        await saveState();

        render();


        setStatus(
          "Scanning Genesis → current",
          `Starting from block ${
            state.verifiedThrough + 1
          }`,
          "running"
        );


        while (
          !state.stopRequested
        ) {

          /*
          --------------------------------------------------------
          Reached current tip?
          Check the live node one more time.
          --------------------------------------------------------
          */

          if (
            state.verifiedThrough >=
            state.chainHeight
          ) {

            info =
              await getInfo();


            chainHeight =
              Number(
                info.height ??
                info.chain_height ??
                0
              );


            state.chainHeight =
              chainHeight;


            await saveState();

            render();


            if (
              state.verifiedThrough >=
              state.chainHeight
            ) {

              setStatus(
                "Chain current",
                `Verified through #${
                  state.verifiedThrough
                }`,
                "current"
              );


              break;

            }


            continue;

          }


          /*
          --------------------------------------------------------
          Periodic live-tip check.
          --------------------------------------------------------
          */

          if (
            state.blocksSinceTipCheck >=
            TIP_CHECK_INTERVAL
          ) {

            info =
              await getInfo();


            chainHeight =
              Number(
                info.height ??
                info.chain_height ??
                0
              );


            state.chainHeight =
              chainHeight;


            state.blocksSinceTipCheck =
              0;


            await saveState();

            render();

          }


          /*
          --------------------------------------------------------
          Calculate next contiguous batch.
          --------------------------------------------------------
          */

          const start =
            state.verifiedThrough +
            1;


          const end =
            Math.min(
              start +
              BATCH_SIZE -
              1,

              state.chainHeight
            );


          setStatus(
            `Scanning #${start} → #${end}`,
            `Verified through #${
              state.verifiedThrough
            }`,
            "running"
          );


          await scanBatch(
            start,
            end
          );


          if (
            state.stopRequested
          ) {

            break;

          }

        }

      } catch (error) {

        console.error(
          "Scan failed:",
          error
        );


        showError(
          error.message
        );


        setStatus(
          "Scan paused",
          "The failed batch was not marked as verified.",
          "error"
        );

      } finally {

        state.scanning =
          false;


        updateButtons();

        render();


        if (
          state.stopRequested
        ) {

          setStatus(
            "Scan stopped",
            `Safe checkpoint: verified through #${
              state.verifiedThrough
            }`,
            "idle"
          );

        }

      }

    }


    /*
    ============================================================
    STOP
    ============================================================
    */

    function stopScan() {

      if (
        !state.scanning
      ) {

        return;

      }


      state.stopRequested =
        true;


      setStatus(
        "Stopping...",
        "Finishing the current request safely.",
        "running"
      );


      updateButtons();

    }


    /*
    ============================================================
    REBUILD
    ============================================================
    */

    async function rebuildFromGenesis() {

      if (
        state.scanning
      ) {

        return;

      }


      const confirmed =
        confirm(
          "Rebuild from Genesis? This will erase the saved scanner checkpoint and whisper database."
        );


      if (
        !confirmed
      ) {

        return;

      }


      state.verifiedThrough =
        -1;


      state.chainHeight =
        -1;


      state.whispers.clear();


      state.blocksSinceTipCheck =
        0;


      hideError();


      try {

        await dbClear(
          "meta"
        );


        await dbClear(
          "whispers"
        );


        await saveState();


        render();


        setStatus(
          "Reset complete",
          "Press Start Scan to begin again at Genesis.",
          "idle"
        );

      } catch (error) {

        showError(
          error.message
        );

      }

    }


    /*
    ============================================================
    RENDER
    ============================================================
    */

    function render() {

      /*
      ----------------------------------------------------------
      Stats
      ----------------------------------------------------------
      */

      document.getElementById(
        "chainHeight"
      ).textContent =
        state.chainHeight >= 0
          ? `#${state.chainHeight}`
          : "—";


      document.getElementById(
        "verifiedThrough"
      ).textContent =
        state.verifiedThrough >= 0
          ? `#${state.verifiedThrough}`
          : "—";


      document.getElementById(
        "whisperCount"
      ).textContent =
        state.whispers.size;


      const remaining =
        state.chainHeight >= 0
          ? Math.max(
              0,
              state.chainHeight -
              state.verifiedThrough
            )
          : null;


      document.getElementById(
        "blocksRemaining"
      ).textContent =
        remaining === null
          ? "—"
          : remaining;


      /*
      ----------------------------------------------------------
      Progress
      ----------------------------------------------------------
      */

      let progress = 0;


      if (
        state.chainHeight >= 0 &&
        state.verifiedThrough >= 0
      ) {

        progress =
          (
            (state.verifiedThrough + 1) /
            (state.chainHeight + 1)
          ) *
          100;


        progress =
          Math.min(
            100,
            Math.max(
              0,
              progress
            )
          );

      }


      document.getElementById(
        "progressBar"
      ).style.width =
        `${progress}%`;


      renderFeed();

    }


    /*
    ============================================================
    RENDER FEED
    ============================================================
    */

    function renderFeed() {

      const feed =
        document.getElementById(
          "feed"
        );


      const count =
        document.getElementById(
          "feedCount"
        );


      const query =
        document.getElementById(
          "searchInput"
        ).value
        .trim()
        .toLowerCase();


      const items =
        Array.from(
          state.whispers.values()
        )
        .filter(
          item => {

            if (!query) {

              return true;

            }


            return [

              item.memo,

              item.sender,

              item.recipient,

              item.tx_hash,

              String(
                item.block
              )

            ]
              .join(" ")
              .toLowerCase()
              .includes(
                query
              );

          }
        )
        .sort(
          (a, b) => {

            if (
              b.block !==
              a.block
            ) {

              return (
                b.block -
                a.block
              );

            }


            return String(
              b.tx_hash
            ).localeCompare(
              String(
                a.tx_hash
              )
            );

          }
        );


      count.textContent =
        query
          ? `${items.length} matching`
          : `${items.length} whisper${
              items.length === 1
                ? ""
                : "s"
            }`;


      if (
        items.length === 0
      ) {

        feed.innerHTML =
          `<div class="empty">
            ${
              query
                ? "No whispers match your search."
                : "No whispers loaded yet."
            }
          </div>`;


        return;

      }


      feed.innerHTML =
        items
          .map(
            renderWhisper
          )
          .join("");

    }


    /*
    ============================================================
    RENDER ONE WHISPER
    ============================================================
    */

    function renderWhisper(
      item
    ) {

      const block =
        Number(
          item.block
        );


      const tx =
        String(
          item.tx_hash || ""
        );


      const sender =
        String(
          item.sender || ""
        );


      const recipient =
        String(
          item.recipient || ""
        );


      /*
      ----------------------------------------------------------
      Preserve readable system labels.
      Only shorten actual long addresses.
      ----------------------------------------------------------
      */

      const senderDisplay =
        sender
          ? sender.length > 24
            ? shortHash(
                sender,
                10,
                8
              )
            : sender
          : "Unknown";


      const recipientDisplay =
        recipient
          ? recipient.length > 24
            ? shortHash(
                recipient,
                10,
                8
              )
            : recipient
          : "Unknown";


      const txDisplay =
        shortHash(
          tx,
          10,
          10
        );


      const safeMemo =
        escapeHtml(
          item.memo
        );


      const safeTimestamp =
        escapeHtml(
          formatTimestamp(
            item.timestamp
          )
        );


      const safeSender =
        escapeHtml(
          sender
        );


      const safeRecipient =
        escapeHtml(
          recipient
        );


      return `

        <article class="whisper">

          <!-- BLOCK + DATE/TIME -->

          <div class="whisper-top">

            <div class="block-number">
              #${escapeHtml(block)}
            </div>

            <div class="timestamp">
              ${safeTimestamp}
            </div>

          </div>


          <!-- MEMO -->

          <div class="memo">
            ${safeMemo}
          </div>


          <!-- DETAILS -->

          <div class="details">


            <!-- AMOUNT -->

            <div class="label">
              Amount
            </div>

            <div class="value amount">
              ${formatAmount(
                item.amount
              )}
            </div>


            <!-- TX -->

            <div class="label">
              TX
            </div>

            <div class="value mono">

              <a
                class="compact-link"
                href="${txUrl(tx)}"
                target="_blank"
                rel="noopener noreferrer"
                title="${escapeHtml(tx)}"
              >

                <span class="short-text">
                  ${escapeHtml(
                    txDisplay
                  )}
                </span>

                <span class="external">
                  ↗
                </span>

              </a>

            </div>


            <!-- FROM -->

            <div class="label">
              From
            </div>

            <div class="value mono">

              ${
                sender
                  ? `

                    <a
                      class="compact-link"
                      href="${addressUrl(sender)}"
                      target="_blank"
                      rel="noopener noreferrer"
                      title="${safeSender}"
                    >

                      <span class="short-text">
                        ${escapeHtml(
                          senderDisplay
                        )}
                      </span>

                      <span class="external">
                        ↗
                      </span>

                    </a>

                  `
                  : "Unknown"
              }

            </div>


            <!-- TO -->

            <div class="label">
              To
            </div>

            <div class="value mono">

              ${
                recipient
                  ? `

                    <a
                      class="compact-link"
                      href="${addressUrl(recipient)}"
                      target="_blank"
                      rel="noopener noreferrer"
                      title="${safeRecipient}"
                    >

                      <span class="short-text">
                        ${escapeHtml(
                          recipientDisplay
                        )}
                      </span>

                      <span class="external">
                        ↗
                      </span>

                    </a>

                  `
                  : "Unknown"
              }

            </div>


          </div>

        </article>

      `;

    }


    /*
    ============================================================
    STATUS
    ============================================================
    */

    function setStatus(
      title,
      detail,
      mode = "idle"
    ) {

      document.getElementById(
        "statusTitle"
      ).textContent =
        title;


      document.getElementById(
        "statusDetail"
      ).textContent =
        detail;


      const pill =
        document.getElementById(
          "statusPill"
        );


      pill.className =
        "status-pill";


      if (
        mode === "running"
      ) {

        pill.classList.add(
          "running"
        );

        pill.textContent =
          "SCANNING";

      } else if (
        mode === "current"
      ) {

        pill.classList.add(
          "current"
        );

        pill.textContent =
          "CURRENT";

      } else if (
        mode === "error"
      ) {

        pill.classList.add(
          "error"
        );

        pill.textContent =
          "ERROR";

      } else {

        pill.textContent =
          "IDLE";

      }

    }


    /*
    ============================================================
    BUTTONS
    ============================================================
    */

    function updateButtons() {

      const running =
        state.scanning;


      document.getElementById(
        "startBtn"
      ).disabled =
        running;


      document.getElementById(
        "stopBtn"
      ).disabled =
        !running;


      document.getElementById(
        "rebuildBtn"
      ).disabled =
        running;

    }


    /*
    ============================================================
    ERROR
    ============================================================
    */

    function showError(
      message
    ) {

      const box =
        document.getElementById(
          "errorBox"
        );


      box.textContent =
        message;


      box.style.display =
        "block";

    }


    function hideError() {

      const box =
        document.getElementById(
          "errorBox"
        );


      box.textContent =
        "";


      box.style.display =
        "none";

    }


    /*
    ============================================================
    INITIALISE
    ============================================================
    */

    async function initialise() {

      try {

        await openDatabase();


        await loadState();


        await loadWhispers();


        render();


        if (
          state.verifiedThrough >= 0
        ) {

          setStatus(
            "Ready",
            `Saved checkpoint: verified through #${
              state.verifiedThrough
            }. Press Start Scan to continue.`,
            "idle"
          );

        } else {

          setStatus(
            "Ready",
            "Press Start Scan to verify the NEV369 chain from Genesis.",
            "idle"
          );

        }


        updateButtons();

      } catch (error) {

        console.error(
          "Initialisation failed:",
          error
        );


        showError(
          error.message
        );


        setStatus(
          "Initialisation failed",
          "IndexedDB could not be opened.",
          "error"
        );

      }

    }


    /*
    ============================================================
    SEARCH
    ============================================================
    */

    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(
        "input",
        renderFeed
      );


    /*
    ============================================================
    START
    ============================================================
    */

    initialise();


    /*
    ============================================================
    AUTOMATIC LIVE CHECK

    The page starts idle.

    After 369 seconds of being left open,
    it will resume the scanner to pick up new blocks.

    It never starts immediately on page load.
    ============================================================
    */

    setInterval(
      () => {

        if (
          !state.scanning
        ) {

          startScan();

        }

      },
      AUTO_REFRESH_MS
    );

  </script>
