<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NevWhisper — NEV369 Memo Chat</title>

<style>
:root {
  --bg: #09080f;
  --bg-soft: #0e0c17;
  --panel: #12101d;
  --panel-2: #171423;
  --panel-3: #1c182a;

  --border: rgba(154, 122, 255, 0.16);
  --border-strong: rgba(154, 122, 255, 0.28);

  --purple: #9b7cff;
  --purple-bright: #b59aff;
  --purple-soft: rgba(155, 124, 255, 0.12);

  --blue: #62a8ff;
  --green: #62e6a5;
  --yellow: #ffd166;
  --red: #ff6b81;

  --text: #f4f1fb;
  --text-soft: #c9c4d7;
  --muted: #858094;

  --radius: 18px;
  --radius-small: 12px;

  --shadow: 0 18px 60px rgba(0, 0, 0, 0.34);
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% -10%, rgba(112, 78, 210, 0.16), transparent 38%),
    radial-gradient(circle at 100% 20%, rgba(53, 93, 190, 0.07), transparent 32%),
    var(--bg);
  color: var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

a {
  color: inherit;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.container {
  width: min(1100px, calc(100% - 28px));
  margin: 0 auto;
  padding: 34px 0 70px;
}

/* --------------------------------------------------
   HEADER
-------------------------------------------------- */

.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 28px;
}

.brand {
  min-width: 0;
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
  font-size: clamp(26px, 5vw, 38px);
  font-weight: 750;
  letter-spacing: -0.045em;
}

.brand-mark {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--purple);
  box-shadow:
    0 0 12px rgba(155, 124, 255, 0.75),
    0 0 28px rgba(155, 124, 255, 0.3);
}

.subtitle {
  margin-top: 7px;
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.live-area {
  text-align: right;
  white-space: nowrap;
}

.live-status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--text-soft);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 12px rgba(98, 230, 165, 0.65);
}

.live-dot.scanning {
  background: var(--purple);
  box-shadow: 0 0 12px rgba(155, 124, 255, 0.7);
  animation: pulse 1.4s ease-in-out infinite;
}

.live-dot.error {
  background: var(--red);
  box-shadow: 0 0 12px rgba(255, 107, 129, 0.6);
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }

  50% {
    opacity: 0.55;
    transform: scale(0.78);
  }
}

/* --------------------------------------------------
   STATUS
-------------------------------------------------- */

.status-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;

  padding: 14px 17px;
  margin-bottom: 18px;

  border: 1px solid var(--border);
  border-radius: var(--radius-small);

  background:
    linear-gradient(
      135deg,
      rgba(155, 124, 255, 0.075),
      rgba(98, 168, 255, 0.025)
    ),
    var(--panel);
}

.status-main {
  min-width: 0;
}

.status-label {
  color: var(--text-soft);
  font-size: 13px;
  font-weight: 650;
}

.status-detail {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}

.countdown {
  flex-shrink: 0;
  color: var(--purple-bright);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
}

/* --------------------------------------------------
   ARCHITECT PIN
-------------------------------------------------- */

.architect {
  position: relative;
  overflow: hidden;

  margin-bottom: 22px;
  padding: 23px 24px;

  border: 1px solid rgba(155, 124, 255, 0.3);
  border-radius: var(--radius);

  background:
    radial-gradient(
      circle at 0% 0%,
      rgba(155, 124, 255, 0.16),
      transparent 42%
    ),
    radial-gradient(
      circle at 100% 100%,
      rgba(98, 168, 255, 0.055),
      transparent 35%
    ),
    var(--panel);

  box-shadow:
    0 18px 55px rgba(58, 31, 115, 0.12),
    inset 0 1px 0 rgba(255,255,255,0.025);
}

.architect::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: linear-gradient(
    180deg,
    var(--purple-bright),
    rgba(98, 168, 255, 0.55)
  );
}

.architect-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.architect-title {
  display: flex;
  align-items: center;
  gap: 9px;

  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.13em;
  color: var(--purple-bright);
}

.pin {
  font-size: 15px;
}

.architect-tag {
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.architect-message {
  color: var(--text);
  font-size: clamp(18px, 3vw, 24px);
  line-height: 1.4;
  letter-spacing: -0.018em;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.architect-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  margin-top: 17px;

  color: var(--muted);
  font-size: 12px;
}

.architect-meta strong {
  color: var(--text-soft);
}

.architect-meta a {
  color: var(--purple-bright);
  text-decoration: none;
}

.architect-meta a:hover {
  text-decoration: underline;
}

/* --------------------------------------------------
   STATS
-------------------------------------------------- */

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.stat {
  min-width: 0;
  padding: 15px 16px;

  border: 1px solid var(--border);
  border-radius: var(--radius-small);
  background: rgba(18, 16, 29, 0.8);
}

.stat-label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.stat-value {
  margin-top: 7px;
  color: var(--text);
  font-size: 20px;
  font-weight: 720;
  letter-spacing: -0.025em;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* --------------------------------------------------
   PROGRESS
-------------------------------------------------- */

.progress-panel {
  margin-bottom: 22px;
}

.progress-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.progress-label {
  color: var(--text-soft);
  font-size: 12px;
  font-weight: 650;
}

.progress-percent {
  color: var(--muted);
  font-size: 11px;
}

.progress-track {
  height: 5px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255,255,255,0.06);
}

.progress-fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(
    90deg,
    var(--purple),
    var(--blue)
  );
  box-shadow: 0 0 14px rgba(155, 124, 255, 0.35);
  transition: width 0.35s ease;
}

/* --------------------------------------------------
   SEARCH
-------------------------------------------------- */

.search-wrap {
  position: relative;
  margin-bottom: 20px;
}

.search {
  width: 100%;
  height: 48px;
  padding: 0 17px 0 44px;

  border: 1px solid var(--border);
  border-radius: 14px;

  outline: none;

  color: var(--text);
  background: rgba(18, 16, 29, 0.9);

  transition:
    border-color 0.18s ease,
    box-shadow 0.18s ease;
}

.search::placeholder {
  color: #6f6a7d;
}

.search:focus {
  border-color: var(--border-strong);
  box-shadow: 0 0 0 3px rgba(155, 124, 255, 0.07);
}

.search-icon {
  position: absolute;
  left: 17px;
  top: 50%;
  transform: translateY(-50%);

  color: var(--muted);
  font-size: 16px;
  pointer-events: none;
}

/* --------------------------------------------------
   SECTION HEADING
-------------------------------------------------- */

.section-heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;

  margin: 0 2px 10px;
}

.section-title {
  color: var(--text-soft);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.section-count {
  color: var(--muted);
  font-size: 11px;
}

/* --------------------------------------------------
   WHISPERS
-------------------------------------------------- */

.whispers {
  display: grid;
  gap: 9px;
}

.whisper {
  padding: 16px 17px;

  border: 1px solid var(--border);
  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,0.012),
      rgba(155, 124, 255, 0.018)
    ),
    var(--panel);

  transition:
    border-color 0.18s ease,
    background 0.18s ease,
    transform 0.18s ease;
}

.whisper:hover {
  border-color: var(--border-strong);
  background: var(--panel-2);
}

.whisper.new {
  animation: newWhisper 1.8s ease-out;
}

@keyframes newWhisper {
  0% {
    border-color: rgba(155, 124, 255, 0.8);
    box-shadow: 0 0 28px rgba(155, 124, 255, 0.14);
  }

  100% {
    border-color: var(--border);
    box-shadow: none;
  }
}

.whisper-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 11px;
}

.block-link {
  color: var(--purple-bright);
  font-size: 13px;
  font-weight: 750;
  text-decoration: none;
}

.block-link:hover {
  text-decoration: underline;
}

.timestamp {
  color: var(--muted);
  font-size: 11px;
  text-align: right;
}

.memo {
  color: var(--text);
  font-size: 15px;
  line-height: 1.55;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.details {
  display: grid;
  grid-template-columns: 90px minmax(0, 1fr);
  gap: 6px 12px;
  margin-top: 14px;
}

.detail-label {
  color: var(--muted);
  font-size: 11px;
}

.detail-value {
  min-width: 0;
  color: var(--text-soft);
  font-size: 11px;
  overflow-wrap: anywhere;
}

.detail-value a {
  color: var(--text-soft);
  text-decoration: none;
}

.detail-value a:hover {
  color: var(--purple-bright);
  text-decoration: underline;
}

.empty {
  padding: 38px 20px;
  border: 1px dashed var(--border);
  border-radius: var(--radius-small);
  color: var(--muted);
  text-align: center;
  font-size: 13px;
}

/* --------------------------------------------------
   FOOTER / CONTROLS
-------------------------------------------------- */

.controls {
  display: flex;
  justify-content: center;
  margin-top: 24px;
}

.rebuild {
  padding: 9px 14px;

  border: 1px solid var(--border);
  border-radius: 10px;

  color: var(--muted);
  background: transparent;

  font-size: 11px;
}

.rebuild:hover {
  color: var(--text-soft);
  border-color: var(--border-strong);
  background: rgba(155, 124, 255, 0.04);
}

.footer {
  margin-top: 38px;
  color: #555162;
  font-size: 10px;
  text-align: center;
  letter-spacing: 0.04em;
}

/* --------------------------------------------------
   RESPONSIVE
-------------------------------------------------- */

@media (max-width: 720px) {
  .container {
    width: min(100% - 18px, 1100px);
    padding-top: 22px;
  }

  .header {
    align-items: flex-start;
  }

  .live-area {
    display: none;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .status-panel {
    align-items: flex-start;
    flex-direction: column;
    gap: 8px;
  }

  .countdown {
    font-size: 12px;
  }

  .architect {
    padding: 20px 19px;
  }

  .whisper-top {
    align-items: flex-start;
    flex-direction: column;
    gap: 5px;
  }

  .timestamp {
    text-align: left;
  }
}

@media (max-width: 430px) {
  .stats {
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }

  .stat {
    padding: 12px;
  }

  .stat-value {
    font-size: 17px;
  }

  .details {
    grid-template-columns: 70px minmax(0, 1fr);
  }
}
</style>
</head>

<script>
"use strict";

/* ==================================================
   CONFIGURATION
================================================== */

const NODE =
  "https://nevwhisper-proxy.mattcodeai91.workers.dev";

const DB_NAME = "nevwhisper-genesis-v1";
const DB_VERSION = 1;

const BATCH_SIZE = 10;

/*
  The scanner checks the live chain every 15 seconds.
*/
const LIVE_POLL_MS = 15000;

/*
  Network retry configuration.
*/
const MAX_RETRIES = 4;
const RETRY_DELAY = 1500;


/* ==================================================
   STATE
================================================== */

const state = {
  verifiedThrough: -1,
  chainHeight: -1,

  whispers: new Map(),

  scanning: false,
  stopRequested: false,

  latestArchitect: null,

  newWhisperBlocks: new Set(),

  livePollTimer: null,
  livePollRunning: false
};


/* ==================================================
   DOM
================================================== */

const els = {
  statusLabel:
    document.getElementById("statusLabel"),

  statusDetail:
    document.getElementById("statusDetail"),

  countdown:
    document.getElementById("countdown"),

  liveDot:
    document.getElementById("liveDot"),

  liveStatus:
    document.getElementById("liveStatus"),

  architectMessage:
    document.getElementById("architectMessage"),

  architectMeta:
    document.getElementById("architectMeta"),

  chainHeight:
    document.getElementById("chainHeight"),

  verifiedThrough:
    document.getElementById("verifiedThrough"),

  whisperCount:
    document.getElementById("whisperCount"),

  blocksRemaining:
    document.getElementById("blocksRemaining"),

  progressPercent:
    document.getElementById("progressPercent"),

  progressFill:
    document.getElementById("progressFill"),

  search:
    document.getElementById("search"),

  whispers:
    document.getElementById("whispers"),

  sectionCount:
    document.getElementById("sectionCount"),

  rebuild:
    document.getElementById("rebuild")
};


/* ==================================================
   HELPERS
================================================== */

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function shorten(value, start = 12, end = 10) {
  if (!value) {
    return "—";
  }

  const text = String(value);

  if (text.length <= start + end + 3) {
    return text;
  }

  return (
    text.slice(0, start) +
    "..." +
    text.slice(-end)
  );
}


function formatNumber(value) {
  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "—";
  }

  return n.toLocaleString();
}


function formatAmount(value) {
  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "—";
  }

  const n = Number(value);

  if (!Number.isFinite(n)) {
    return String(value);
  }

  /*
    NEV369 uses 8 decimal places.
  */
  const nev = n / 100000000;

  return (
    nev.toLocaleString(undefined, {
      maximumFractionDigits: 8
    }) +
    " NEV"
  );
}


function formatTimestamp(value) {
  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return "Unknown time";
  }

  const n = Number(value);

  if (!Number.isFinite(n)) {
    const d = new Date(value);

    return Number.isNaN(d.getTime())
      ? "Unknown time"
      : d.toLocaleString();
  }

  let milliseconds;

  /*
    Support seconds, milliseconds,
    microseconds and nanoseconds.
  */

  if (n < 1e12) {
    milliseconds = n * 1000;
  } else if (n < 1e15) {
    milliseconds = n;
  } else if (n < 1e18) {
    milliseconds = n / 1000;
  } else {
    milliseconds = n / 1000000;
  }

  const d = new Date(milliseconds);

  return Number.isNaN(d.getTime())
    ? "Unknown time"
    : d.toLocaleString();
}


function txUrl(tx) {
  if (!tx) {
    return "#";
  }

  return (
    "https://q-lock-ecosystem.com/explorer/#/tx/" +
    encodeURIComponent(tx)
  );
}


function blockUrl(height) {
  return (
    "https://q-lock-ecosystem.com/explorer/#/block/" +
    encodeURIComponent(height)
  );
}


function addressUrl(address) {
  if (!address) {
    return "#";
  }

  return (
    "https://q-lock-ecosystem.com/explorer/#/address/" +
    encodeURIComponent(address)
  );
}


/* ==================================================
   DATABASE
================================================== */

let dbPromise = null;


function openDb() {
  if (dbPromise) {
    return dbPromise;
  }

  dbPromise = new Promise((resolve, reject) => {

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );

    request.onupgradeneeded = event => {

      const db =
        event.target.result;

      /*
        IMPORTANT:

        The live database uses:

        meta:
          out-of-line keys

        whispers:
          keyPath = tx_hash

        We deliberately DO NOT recreate or
        replace the stores.

        Doing so could destroy existing data.
      */

      if (
        !db.objectStoreNames.contains(
          "meta"
        )
      ) {
        db.createObjectStore("meta");
      }

      if (
        !db.objectStoreNames.contains(
          "whispers"
        )
      ) {
        db.createObjectStore(
          "whispers",
          {
            keyPath: "tx_hash"
          }
        );
      }
    };

    request.onsuccess = () => {

      const db =
        request.result;

      /*
        If another tab upgrades the database,
        close this connection so a fresh
        connection can be established.
      */

      db.onversionchange = () => {
        db.close();
        dbPromise = null;
      };

      resolve(db);
    };

    request.onerror = () => {
      reject(request.error);
    };

  });

  return dbPromise;
}


async function dbGet(
  storeName,
  key
) {
  const db =
    await openDb();

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          storeName,
          "readonly"
        );

      const store =
        tx.objectStore(
          storeName
        );

      const request =
        store.get(key);

      request.onsuccess =
        () => resolve(
          request.result
        );

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


async function dbGetAll(
  storeName
) {
  const db =
    await openDb();

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          storeName,
          "readonly"
        );

      const store =
        tx.objectStore(
          storeName
        );

      const request =
        store.getAll();

      request.onsuccess =
        () => resolve(
          request.result || []
        );

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


async function dbPut(
  storeName,
  value,
  key
) {
  const db =
    await openDb();

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          storeName,
          "readwrite"
        );

      const store =
        tx.objectStore(
          storeName
        );

      let request;

      /*
        meta uses out-of-line keys.

        whispers uses keyPath tx_hash.

        Therefore only pass an explicit key
        when we actually have one.
      */

      if (key === undefined) {
        request =
          store.put(value);
      } else {
        request =
          store.put(
            value,
            key
          );
      }

      request.onsuccess =
        () => resolve();

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


async function dbClear(
  storeName
) {
  const db =
    await openDb();

  return new Promise(
    (resolve, reject) => {

      const tx =
        db.transaction(
          storeName,
          "readwrite"
        );

      const store =
        tx.objectStore(
          storeName
        );

      const request =
        store.clear();

      request.onsuccess =
        () => resolve();

      request.onerror =
        () => reject(
          request.error
        );
    }
  );
}


/* ==================================================
   DATABASE LOAD
================================================== */

async function loadDatabase() {

  const verified =
    await dbGet(
      "meta",
      "verifiedThrough"
    );

  const height =
    await dbGet(
      "meta",
      "chainHeight"
    );

  /*
    CRITICAL FIX:

    The current whispers store has:

      keyPath: tx_hash

    Therefore get("all") is WRONG.

    Read every actual whisper record instead.
  */

  const whisperRecords =
    await dbGetAll(
      "whispers"
    );

  state.verifiedThrough =
    Number.isFinite(
      Number(verified)
    )
      ? Number(verified)
      : -1;

  state.chainHeight =
    Number.isFinite(
      Number(height)
    )
      ? Number(height)
      : -1;

  state.whispers.clear();

  /*
    Load all persisted whispers.

    The state Map is keyed by block for
    rendering / searching, while IndexedDB
    remains keyed by tx_hash.
  */

  for (
    const whisper of whisperRecords
  ) {

    if (
      !whisper ||
      !Number.isFinite(
        Number(whisper.block)
      )
    ) {
      continue;
    }

    /*
      A transaction can theoretically contain
      multiple memo records at the same block,
      so use tx_hash as the uniqueness anchor
      internally where possible.

      The UI archive is still block-oriented.
    */

    const block =
      Number(whisper.block);

    const existing =
      state.whispers.get(block);

    /*
      Prefer a whisper with a transaction hash.
    */

    if (
      !existing ||
      (
        !existing.tx &&
        whisper.tx
      )
    ) {
      state.whispers.set(
        block,
        whisper
      );
    }
  }

  /*
    Reconstruct Architect pin.
  */

  state.latestArchitect =
    null;

  for (
    const whisper of
    state.whispers.values()
  ) {

    if (
      isArchitectWhisper(
        whisper
      )
    ) {

      if (
        !state.latestArchitect ||
        Number(whisper.block) >
        Number(
          state.latestArchitect.block
        )
      ) {
        state.latestArchitect =
          whisper;
      }
    }
  }
}


async function saveCheckpoint() {

  /*
    These are deliberately stored as:

      value, "verifiedThrough"

    rather than objects.

    This matches the existing DB.
  */

  await dbPut(
    "meta",
    state.verifiedThrough,
    "verifiedThrough"
  );

  await dbPut(
    "meta",
    state.chainHeight,
    "chainHeight"
  );
}


async function saveWhisper(
  whisper
) {

  /*
    IMPORTANT:

    Current store keyPath is tx_hash.

    Do NOT pass whisper.block as the
    IndexedDB key.
  */

  if (
    !whisper ||
    !whisper.tx
  ) {
    return;
  }

  await dbPut(
    "whispers",
    whisper
  );
}


/* ==================================================
   NETWORK
================================================== */

async function sleep(ms) {
  return new Promise(
    resolve => {
      setTimeout(
        resolve,
        ms
      );
    }
  );
}


async function getJson(
  path,
  attempt = 0
) {

  try {

    const response =
      await fetch(
        NODE.replace(
          /\/$/,
          ""
        ) + path,
        {
          cache: "no-store"
        }
      );

    const text =
      await response.text();

    let data;

    try {
      data =
        JSON.parse(text);
    } catch {
      data =
        text;
    }

    if (!response.ok) {

      const error =
        new Error(
          `${response.status} — ${
            data &&
            data.error
              ? data.error
              : response.statusText
          }`
        );

      error.status =
        response.status;

      /*
        Preserve Retry-After when supplied.
      */

      error.retryAfter =
        response.headers.get(
          "Retry-After"
        );

      throw error;
    }

    return data;

  } catch (error) {

    if (
      attempt >= MAX_RETRIES
    ) {
      throw error;
    }

    let delay =
      RETRY_DELAY *
      Math.pow(
        2,
        attempt
      );

    const retryAfter =
      Number(
        error?.retryAfter
      );

    if (
      Number.isFinite(
        retryAfter
      ) &&
      retryAfter > 0
    ) {
      delay =
        Math.max(
          delay,
          retryAfter * 1000
        );
    }

    /*
      Small jitter prevents synchronized retries.
    */

    delay +=
      Math.floor(
        Math.random() * 500
      );

    await sleep(delay);

    return getJson(
      path,
      attempt + 1
    );
  }
}


async function getInfo() {

  const data =
    await getJson(
      "/info"
    );

  const height =
    Number(
      data?.height ??
      data?.chain_height
    );

  if (
    !Number.isFinite(height)
  ) {
    throw new Error(
      "Node returned no valid chain height."
    );
  }

  state.chainHeight =
    height;

  await dbPut(
    "meta",
    state.chainHeight,
    "chainHeight"
  );

  return data;
}


/* ==================================================
   WHISPER NORMALISATION
================================================== */

function firstValue(
  object,
  keys
) {

  for (
    const key of keys
  ) {

    if (
      object &&
      object[key] !== undefined &&
      object[key] !== null &&
      object[key] !== ""
    ) {
      return object[key];
    }
  }

  return null;
}


function normalizeWhisper(
  item
) {

  if (
    !item ||
    typeof item !== "object"
  ) {
    return null;
  }

  const blockValue =
    firstValue(
      item,
      [
        "block",
        "height",
        "block_height",
        "blockHeight"
      ]
    );

  const block =
    Number(blockValue);

  if (
    !Number.isFinite(block)
  ) {
    return null;
  }

  const memo =
    firstValue(
      item,
      [
        "memo",
        "payload_memo",
        "message",
        "text"
      ]
    );

  if (
    memo === null ||
    memo === undefined ||
    String(memo).trim() === ""
  ) {
    return null;
  }

  const sender =
    firstValue(
      item,
      [
        "from",
        "sender",
        "from_address",
        "sender_address"
      ]
    );

  const to =
    firstValue(
      item,
      [
        "to",
        "recipient",
        "to_address",
        "recipient_address"
      ]
    );

  const tx =
    firstValue(
      item,
      [
        "tx",
        "txid",
        "tx_hash",
        "transaction",
        "transaction_hash",
        "hash"
      ]
    );

  const timestamp =
    firstValue(
      item,
      [
        "timestamp",
        "time",
        "created_at",
        "block_timestamp"
      ]
    );

  const amount =
    firstValue(
      item,
      [
        "amount",
        "value",
        "amount_base_units"
      ]
    );

  return {
    block,

    memo:
      String(memo),

    sender:
      sender
        ? String(sender)
        : "",

    to:
      to
        ? String(to)
        : "",

    tx:
      tx
        ? String(tx)
        : "",

    timestamp,

    amount
  };
}


function extractWhispers(
  payload
) {

  if (
    Array.isArray(payload)
  ) {
    return payload;
  }

  if (
    !payload ||
    typeof payload !== "object"
  ) {
    return [];
  }

  const candidates = [
    payload.whispers,
    payload.results,
    payload.data,
    payload.messages,
    payload.items
  ];

  for (
    const candidate of
    candidates
  ) {

    if (
      Array.isArray(candidate)
    ) {
      return candidate;
    }
  }

  /*
    Some endpoint versions may return
    one object directly.
  */

  if (
    payload.block !== undefined ||
    payload.height !== undefined
  ) {
    return [payload];
  }

  return [];
}


/* ==================================================
   REWARD FILTER
================================================== */

function isNetworkReward(
  whisper
) {

  const sender =
    String(
      whisper?.sender || ""
    )
      .trim()
      .toUpperCase();

  const memo =
    String(
      whisper?.memo || ""
    )
      .trim();

  if (
    sender ===
    "NETWORK_REWARD"
  ) {
    return true;
  }

  if (
    /^Block\s+\d+\s+reward$/i.test(
      memo
    )
  ) {
    return true;
  }

  return false;
}


/* ==================================================
   ARCHITECT DETECTION
================================================== */

/*
  We deliberately do NOT identify a normal user
  message as Architect merely because the word
  "Architect" appears in its memo.

  Genesis Architect establishes the actual
  Architect recipient address.

  Future messages from that address are Architect
  messages.
*/

let architectAddress = null;


function establishArchitectAddress(
  whisper
) {

  if (!whisper) {
    return;
  }

  if (
    Number(whisper.block) === 0 &&
    String(
      whisper.sender || ""
    )
      .trim()
      .toUpperCase() === "GENESIS" &&
    /genesis premine/i.test(
      String(
        whisper.memo || ""
      )
    ) &&
    /architect/i.test(
      String(
        whisper.memo || ""
      )
    ) &&
    whisper.to
  ) {

    architectAddress =
      String(
        whisper.to
      )
        .trim()
        .toLowerCase();
  }
}


function isArchitectWhisper(
  whisper
) {

  if (!whisper) {
    return false;
  }

  const sender =
    String(
      whisper.sender || ""
    )
      .trim()
      .toUpperCase();

  /*
    Explicit Genesis identity.
  */

  if (
    sender === "GENESIS" &&
    Number(whisper.block) === 0 &&
    /architect/i.test(
      String(
        whisper.memo || ""
      )
    ) &&
    !/nevaeh vault/i.test(
      String(
        whisper.memo || ""
      )
    )
  ) {
    establishArchitectAddress(
      whisper
    );

    return true;
  }

  /*
    Explicit Architect labels remain
    supported if the chain provides them.
  */

  if (
    sender === "ARCHITECT" ||
    sender === "THE ARCHITECT"
  ) {
    return true;
  }

  /*
    If Genesis established the Architect
    address, only messages FROM that address
    are considered Architect messages.
  */

  if (
    architectAddress &&
    String(
      whisper.sender || ""
    )
      .trim()
      .toLowerCase() ===
      architectAddress
  ) {
    return true;
  }

  return false;
}


function updateArchitect(
  whisper
) {

  if (
    !isArchitectWhisper(
      whisper
    )
  ) {
    return;
  }

  if (
    !state.latestArchitect ||
    Number(whisper.block) >
    Number(
      state.latestArchitect.block
    )
  ) {

    state.latestArchitect =
      whisper;

    renderArchitect();
  }
}


/* ==================================================
   SCANNING
================================================== */

async function scanBatch(
  startHeight,
  endHeight
) {

  setScanningStatus(
    `Scanning #${startHeight} → #${endHeight}`,
    `Verifying ${endHeight - startHeight + 1} blocks`
  );

  const payload =
    await getJson(
      `/whispers?from=${endHeight}&to=${startHeight}`
    );

  const raw =
    extractWhispers(
      payload
    );

  const batchWhispers =
    [];

  /*
    Do not advance verifiedThrough
    until the complete batch request
    has succeeded.
  */

  for (
    const item of raw
  ) {

    const whisper =
      normalizeWhisper(
        item
      );

    if (!whisper) {
      continue;
    }

    if (
      isNetworkReward(
        whisper
      )
    ) {
      continue;
    }

    /*
      Only retain messages inside the
      requested range.
    */

    if (
      whisper.block <
      startHeight ||
      whisper.block >
      endHeight
    ) {
      continue;
    }

    /*
      Discover Genesis Architect before
      processing future messages.
    */

    establishArchitectAddress(
      whisper
    );

    /*
      Persist using tx_hash key.
    */

    if (whisper.tx) {
      await saveWhisper(
        whisper
      );
    }

    /*
      Keep the in-memory archive keyed
      by block for the existing UI.
    */

    const existing =
      state.whispers.get(
        whisper.block
      );

    if (
      !existing ||
      !existing.tx
    ) {

      state.whispers.set(
        whisper.block,
        whisper
      );

    } else if (
      existing.tx !== whisper.tx
    ) {

      /*
        If a block contains multiple
        whisper transactions, preserve
        the newer unique transaction too.

        The Map remains the UI's compact
        block-oriented index; all actual
        transactions are persisted in
        IndexedDB.
      */

      const syntheticKey =
        `${whisper.block}:${whisper.tx}`;

      /*
        Store additional records in a
        separate in-memory map is not
        required for current chain data,
        but persistence remains safe.
      */

      state.whispers.set(
        syntheticKey,
        whisper
      );
    }

    batchWhispers.push(
      whisper
    );

    updateArchitect(
      whisper
    );

    /*
      Highlight genuinely new whispers.
    */

    state.newWhisperBlocks.add(
      Number(whisper.block)
    );
  }

  /*
    Only now is this range verified.
  */

  state.verifiedThrough =
    endHeight;

  await saveCheckpoint();

  renderAll();

  return batchWhispers;
}


async function startScan() {

  if (
    state.scanning
  ) {
    return;
  }

  state.scanning =
    true;

  state.stopRequested =
    false;

  setScanningStatus(
    "Scanning archive…",
    "Genesis → live chain"
  );

  try {

    /*
      Refresh tip before deciding what
      range needs verification.
    */

    await getInfo();

    while (
      !state.stopRequested
    ) {

      /*
        If the live chain has moved,
        state.chainHeight is updated by
        the 15-second poller.
      */

      const nextStart =
        state.verifiedThrough + 1;

      if (
        nextStart >
        state.chainHeight
      ) {

        /*
          We have caught the current tip.
        */

        setCurrentStatus();

        renderAll();

        return;
      }

      const nextEnd =
        Math.min(
          nextStart +
            BATCH_SIZE -
            1,
          state.chainHeight
        );

      await scanBatch(
        nextStart,
        nextEnd
      );

      /*
        Loop immediately.

        If the live poller increased
        chainHeight during the batch,
        the next iteration will continue
        into those new blocks.

        No old verified blocks are rescanned.
      */
    }

  } catch (error) {

    console.error(
      "NevWhisper scanner error:",
      error
    );

    setErrorStatus(
      "Scanner paused",
      error?.message ||
      "Unable to reach the NEV369 proxy."
    );

    renderAll();

  } finally {

    state.scanning =
      false;
  }
}


/* ==================================================
   LIVE 15-SECOND SYNC
================================================== */

async function pollLiveTip() {

  if (
    state.livePollRunning
  ) {
    return;
  }

  state.livePollRunning =
    true;

  try {

    const oldHeight =
      state.chainHeight;

    const data =
      await getInfo();

    const newHeight =
      Number(
        data?.height ??
        data?.chain_height
      );

    if (
      Number.isFinite(
        newHeight
      ) &&
      newHeight >
      oldHeight
    ) {

      /*
        New blocks exist.

        If the scanner is already running,
        it will naturally consume these
        blocks after its current batch.

        If the scanner is idle/current,
        start it immediately.
      */

      renderAll();

      if (
        !state.scanning
      ) {

        setScanningStatus(
          "New blocks detected",
          `Scanning #${oldHeight + 1} → #${newHeight}`
        );

        await startScan();
      }

    } else if (
      !state.scanning &&
      state.verifiedThrough <
      state.chainHeight
    ) {

      /*
        Database is behind even if the
        tip itself did not change during
        this particular poll.
      */

      await startScan();

    } else if (
      !state.scanning
    ) {

      setCurrentStatus();
      renderAll();
    }

  } catch (error) {

    console.warn(
      "Live tip check failed:",
      error
    );

    /*
      Do not erase existing archive data
      or mark it invalid merely because a
      temporary network poll failed.

      The next 15-second cycle retries.
    */

    if (
      !state.scanning
    ) {

      setErrorStatus(
        "Live sync paused",
        error?.message ||
        "Waiting for the next live check."
      );

      renderAll();
    }

  } finally {

    state.livePollRunning =
      false;
  }
}


function startLivePolling() {

  stopLivePolling();

  /*
    First live check happens immediately.
  */

  pollLiveTip();

  state.livePollTimer =
    setInterval(
      () => {
        pollLiveTip();
      },
      LIVE_POLL_MS
    );
}


function stopLivePolling() {

  if (
    state.livePollTimer
  ) {

    clearInterval(
      state.livePollTimer
    );

    state.livePollTimer =
      null;
  }
}


/* ==================================================
   STATUS
================================================== */

function setScanningStatus(
  label,
  detail
) {

  els.statusLabel.textContent =
    label;

  els.statusDetail.textContent =
    detail;

  els.liveStatus.textContent =
    "SCANNING";

  els.liveDot.classList.add(
    "scanning"
  );

  els.liveDot.classList.remove(
    "error"
  );

  els.countdown.textContent =
    "Live sync every 15 seconds";
}


function setCurrentStatus() {

  els.statusLabel.textContent =
    "Chain current";

  els.statusDetail.textContent =
    `Verified through #${state.verifiedThrough}`;

  els.liveStatus.textContent =
    "LIVE";

  els.liveDot.classList.remove(
    "scanning",
    "error"
  );

  els.countdown.textContent =
    "Live sync every 15 seconds";
}


function setErrorStatus(
  label,
  detail
) {

  els.statusLabel.textContent =
    label;

  els.statusDetail.textContent =
    detail;

  els.liveStatus.textContent =
    "PAUSED";

  els.liveDot.classList.remove(
    "scanning"
  );

  els.liveDot.classList.add(
    "error"
  );

  els.countdown.textContent =
    "Retrying live sync every 15 seconds";
}


/* ==================================================
   RENDER ARCHITECT
================================================== */

function renderArchitect() {

  const whisper =
    state.latestArchitect;

  if (!whisper) {

    els.architectMessage.textContent =
      "Waiting for the Architect…";

    els.architectMeta.innerHTML =
      "<span>No Architect message indexed yet.</span>";

    return;
  }

  els.architectMessage.textContent =
    whisper.memo;

  const block =
    Number(whisper.block);

  const timestamp =
    formatTimestamp(
      whisper.timestamp
    );

  const sender =
    whisper.sender ||
    "UNKNOWN";

  const tx =
    whisper.tx;

  let html = `
    <span>
      Block
      <strong>
        <a
          href="${escapeHtml(
            blockUrl(block)
          )}"
          target="_blank"
          rel="noopener noreferrer"
        >#${formatNumber(block)}</a>
      </strong>
    </span>

    <span>
      ${escapeHtml(timestamp)}
    </span>

    <span>
      From
      <strong>
        ${escapeHtml(sender)}
      </strong>
    </span>
  `;

  if (tx) {

    html += `
      <span>
        <a
          href="${escapeHtml(
            txUrl(tx)
          )}"
          target="_blank"
          rel="noopener noreferrer"
        >
          View transaction ↗
        </a>
      </span>
    `;
  }

  els.architectMeta.innerHTML =
    html;
}


/* ==================================================
   RENDER STATS
================================================== */

function renderStats() {

  els.chainHeight.textContent =
    state.chainHeight >= 0
      ? "#" +
        formatNumber(
          state.chainHeight
        )
      : "—";

  els.verifiedThrough.textContent =
    state.verifiedThrough >= 0
      ? "#" +
        formatNumber(
          state.verifiedThrough
        )
      : "—";

  /*
    Count actual persisted whispers
    represented in the UI archive.

    Filter synthetic internal keys.
  */

  const visibleCount =
    Array.from(
      state.whispers.entries()
    )
      .filter(
        ([key]) =>
          typeof key === "number"
      )
      .length;

  els.whisperCount.textContent =
    formatNumber(
      visibleCount
    );

  const remaining =
    state.chainHeight >= 0
      ? Math.max(
          0,
          state.chainHeight -
          state.verifiedThrough
        )
      : null;

  els.blocksRemaining.textContent =
    remaining === null
      ? "—"
      : formatNumber(
          remaining
        );
}


/* ==================================================
   RENDER PROGRESS
================================================== */

function renderProgress() {

  if (
    state.chainHeight < 0 ||
    state.verifiedThrough < 0
  ) {

    els.progressFill.style.width =
      "0%";

    els.progressPercent.textContent =
      "0%";

    return;
  }

  const total =
    state.chainHeight + 1;

  const verified =
    Math.min(
      total,
      state.verifiedThrough + 1
    );

  const percentage =
    total <= 0
      ? 0
      : Math.min(
          100,
          Math.max(
            0,
            (
              verified /
              total
            ) * 100
          )
        );

  els.progressFill.style.width =
    percentage.toFixed(2) +
    "%";

  els.progressPercent.textContent =
    percentage.toFixed(1) +
    "%";
}


/* ==================================================
   SEARCH
================================================== */

function whisperMatches(
  whisper,
  query
) {

  if (!query) {
    return true;
  }

  const q =
    query.toLowerCase();

  const haystack = [
    whisper.memo,
    whisper.sender,
    whisper.to,
    whisper.tx,
    String(whisper.block),
    formatTimestamp(
      whisper.timestamp
    )
  ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

  return haystack.includes(q);
}


/* ==================================================
   RENDER WHISPERS
================================================== */

function renderWhispers() {

  const query =
    els.search.value
      .trim()
      .toLowerCase();

  /*
    Only numeric block keys are normal
    visible archive entries.

    Synthetic keys are persistence-safe
    duplicates and aren't rendered twice.
  */

  const whispers =
    Array.from(
      state.whispers.entries()
    )
      .filter(
        ([key]) =>
          typeof key === "number"
      )
      .map(
        ([, whisper]) =>
          whisper
      )
      .filter(
        whisper =>
          whisperMatches(
            whisper,
            query
          )
      )
      .sort(
        (a, b) =>
          Number(b.block) -
          Number(a.block)
      );

  els.sectionCount.textContent =
    `${whispers.length} ${
      whispers.length === 1
        ? "whisper"
        : "whispers"
    }`;

  if (
    !whispers.length
  ) {

    els.whispers.innerHTML = `
      <div class="empty">
        ${
          query
            ? "No whispers match your search."
            : "No whispers indexed yet."
        }
      </div>
    `;

    return;
  }

  const fragment =
    document.createDocumentFragment();

  for (
    const whisper of whispers
  ) {

    const card =
      document.createElement(
        "article"
      );

    card.className =
      "whisper";

    if (
      state.newWhisperBlocks.has(
        Number(whisper.block)
      )
    ) {

      card.classList.add(
        "new"
      );

      setTimeout(
        () => {
          state.newWhisperBlocks.delete(
            Number(whisper.block)
          );
        },
        2200
      );
    }

    const block =
      Number(whisper.block);

    const memo =
      escapeHtml(
        whisper.memo
      );

    const timestamp =
      escapeHtml(
        formatTimestamp(
          whisper.timestamp
        )
      );

    const amount =
      formatAmount(
        whisper.amount
      );

    const sender =
      whisper.sender ||
      "—";

    const to =
      whisper.to ||
      "—";

    const tx =
      whisper.tx ||
      "";

    card.innerHTML = `
      <div class="whisper-top">

        <a
          class="block-link"
          href="${escapeHtml(
            blockUrl(block)
          )}"
          target="_blank"
          rel="noopener noreferrer"
          title="Open block #${block}"
        >
          #${formatNumber(block)} ↗
        </a>

        <div class="timestamp">
          ${timestamp}
        </div>

      </div>

      <div class="memo">
        ${memo}
      </div>

      <div class="details">

        <div class="detail-label">
          Amount
        </div>

        <div
          class="detail-value"
          title="${escapeHtml(
            whisper.amount ?? ""
          )}"
        >
          ${escapeHtml(amount)}
        </div>

        <div class="detail-label">
          TX
        </div>

        <div class="detail-value">

          ${
            tx
              ? `
                <a
                  href="${escapeHtml(
                    txUrl(tx)
                  )}"
                  target="_blank"
                  rel="noopener noreferrer"
                  title="${escapeHtml(tx)}"
                >
                  ${escapeHtml(
                    shorten(
                      tx,
                      12,
                      10
                    )
                  )} ↗
                </a>
              `
              : "—"
          }

        </div>

        <div class="detail-label">
          From
        </div>

        <div
          class="detail-value"
          title="${escapeHtml(sender)}"
        >

          ${
            sender !== "—"
              ? `
                <a
                  href="${escapeHtml(
                    addressUrl(sender)
                  )}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ${escapeHtml(
                    shorten(
                      sender,
                      12,
                      10
                    )
                  )} ↗
                </a>
              `
              : "—"
          }

        </div>

        <div class="detail-label">
          To
        </div>

        <div
          class="detail-value"
          title="${escapeHtml(to)}"
        >

          ${
            to !== "—"
              ? `
                <a
                  href="${escapeHtml(
                    addressUrl(to)
                  )}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ${escapeHtml(
                    shorten(
                      to,
                      12,
                      10
                    )
                  )} ↗
                </a>
              `
              : "—"
          }

        </div>

      </div>
    `;

    fragment.appendChild(
      card
    );
  }

  els.whispers.replaceChildren(
    fragment
  );
}


/* ==================================================
   RENDER EVERYTHING
================================================== */

function renderAll() {

  renderStats();

  renderProgress();

  renderArchitect();

  renderWhispers();

  if (
    state.scanning
  ) {

    els.countdown.textContent =
      "Live sync every 15 seconds";

  } else {

    els.countdown.textContent =
      "Live sync every 15 seconds";
  }
}


/* ==================================================
   REBUILD FROM GENESIS
================================================== */

async function rebuildFromGenesis() {

  if (
    state.scanning
  ) {
    return;
  }

  const confirmed =
    window.confirm(
      "Rebuild the NevWhisper archive from Genesis?\n\n" +
      "This clears the local indexed archive and " +
      "starts again from block #0."
    );

  if (!confirmed) {
    return;
  }

  stopLivePolling();

  try {

    await dbClear(
      "meta"
    );

    await dbClear(
      "whispers"
    );

    state.verifiedThrough =
      -1;

    state.chainHeight =
      -1;

    state.whispers.clear();

    state.latestArchitect =
      null;

    architectAddress =
      null;

    state.stopRequested =
      false;

    state.newWhisperBlocks.clear();

    renderAll();

    await startScan();

  } catch (error) {

    console.error(
      error
    );

    setErrorStatus(
      "Rebuild failed",
      error?.message ||
      "Unable to rebuild the archive."
    );

    renderAll();

  } finally {

    startLivePolling();
  }
}


/* ==================================================
   EVENT LISTENERS
================================================== */

els.search.addEventListener(
  "input",
  renderWhispers
);

els.rebuild.addEventListener(
  "click",
  rebuildFromGenesis
);


/* ==================================================
   INITIALISE
================================================== */

async function init() {

  try {

    /*
      1. Load the existing persistent
         archive FIRST.

      This means the UI immediately has
      access to the whispers already stored
      in the browser.
    */

    await loadDatabase();

    /*
      Re-establish Architect identity from
      the Genesis record.
    */

    for (
      const whisper of
      state.whispers.values()
    ) {

      establishArchitectAddress(
        whisper
      );
    }

    renderAll();

    /*
      2. Get the actual current chain tip.
    */

    try {

      await getInfo();

    } catch (error) {

      console.warn(
        "Initial chain info unavailable:",
        error
      );
    }

    renderAll();

    /*
      3. If the database is behind the live
         chain, begin immediately.

      This is the important difference from
      the old version.

      We do NOT wait 369 seconds.
    */

    if (
      state.chainHeight >= 0 &&
      state.verifiedThrough <
      state.chainHeight
    ) {

      await startScan();

    } else if (
      state.chainHeight >= 0
    ) {

      setCurrentStatus();

      renderAll();
    }

    /*
      4. Begin the permanent 15-second
         live tip watcher.

      This remains running after the
      historical scan reaches the tip.
    */

    startLivePolling();

  } catch (error) {

    console.error(
      "NevWhisper initialisation error:",
      error
    );

    setErrorStatus(
      "Initialisation error",
      error?.message ||
      "Unable to initialise NevWhisper."
    );

    renderAll();

    /*
      Even if startup had a temporary
      network problem, keep attempting
      live synchronization.
    */

    startLivePolling();
  }
}


init();
</script>
